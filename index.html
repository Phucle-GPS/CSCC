function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  return {ctx, w, h};
}
function lineChart(id, series, colors, fixedMin) {
  const cv = document.getElementById(id); if (!cv) return;
  const {ctx, w, h} = setupCanvas(cv), L = 40, T = 10, B = 18;
  const all = series.flat().filter(x => x !== null && x !== undefined);
  let lo = fixedMin ?? (all.length ? Math.min(...all) : 0), hi = all.length ? Math.max(...all) : 1;
  if (hi - lo < 1) { hi += 1; lo = Math.max(0, lo - 1); }
  hi += (hi - lo) * 0.1;
  ctx.font = '11px system-ui'; ctx.fillStyle = cssVar('--muted'); ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 1;
  for (let g = 0; g <= 3; g++) {
    const y = T + (h - T - B) * g / 3, val = hi - (hi - lo) * g / 3;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - 6, y); ctx.stroke();
    ctx.fillText(val.toFixed(hi < 10 ? 1 : 0), 4, y + 4);
  }
  ctx.fillText('10 phút trước', L, h - 4); ctx.textAlign = 'right'; ctx.fillText('bây giờ', w - 6, h - 4); ctx.textAlign = 'left';
  series.forEach((s, k) => {
    ctx.strokeStyle = colors[k]; ctx.lineWidth = 2; ctx.beginPath(); let started = false;
    s.forEach((v, n) => {
      if (v === null || v === undefined) { started = false; return; }
      const x = L + (w - 6 - L) * n / Math.max(1, CFG.HIST - 1), y = T + (h - T - B) * (1 - (v - lo) / (hi - lo));
      if (started) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      started = true;
    });
    ctx.stroke();
  });
}
function barChart(id, labels, values) {
  const cv = document.getElementById(id); if (!cv) return;
  const {ctx, w, h} = setupCanvas(cv), L = 36, T = 16, B = 20;
  const hi = Math.max(1, ...values) * 1.15, bw = (w - L - 6) / values.length;
  ctx.font = '11px system-ui'; ctx.fillStyle = cssVar('--muted'); ctx.strokeStyle = cssVar('--line');
  for (let g = 0; g <= 2; g++) { const y = T + (h - T - B) * g / 2; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - 6, y); ctx.stroke(); ctx.fillText((hi - hi * g / 2).toFixed(0), 4, y + 4); }
  values.forEach((v, n) => {
    const bh = (h - T - B) * v / hi, x = L + n * bw + bw * 0.18, y = h - B - bh;
    ctx.fillStyle = n === values.length - 1 ? cssVar('--warn') : cssVar('--accent');
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, bw * 0.64, bh, [4, 4, 0, 0]); else ctx.rect(x, y, bw * 0.64, bh);
    ctx.fill();
    if ((values.length - 1 - n) % 2 === 0) { ctx.fillStyle = cssVar('--muted'); ctx.textAlign = 'center'; ctx.fillText(labels[n], x + bw * 0.32, h - 5); ctx.textAlign = 'left'; }
  });
}

function incAction(op, no) {
  const x = App.incidents.find(i => i.no === no); if (!x) return;
  const now = App.nowFor(App.cabs[x.cab]);
  if (op === 'zalo') { copyText(zaloText(x), 'Đã chép – dán vào nhóm Zalo'); return; }
  if (op === 'assign') { x.status = 'assigned'; x.log.push({t: now, s: `Giao cho ${x.team}`}); toast(`${x.no} đã giao cho ${x.team}`); }
  if (op === 'doing') { x.status = 'doing'; x.log.push({t: now, s: `${x.team} đang xử lý`}); }
  if (op === 'done') {
    const note = prompt('Ghi chú kết quả xử lý (VD: đã nối lại 30m cáp, đã báo CA phường):', x.note || '');
    if (note === null) return;
    x.note = note; x.status = 'done'; x.log.push({t: now, s: `Hoàn thành${note ? ': ' + note : ''}`});
  }
  if (op === 'reopen') { x.status = 'assigned'; x.log.push({t: now, s: 'Mở lại'}); }
  App.saveInc(); render(true);
}

/* ---------- MQTT thật ---------- */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
function setMq(state) { App.mqState = state; updateHeader(); if (route().r === 'cai-dat') render(true); }
async function mqToggle() {
  if (App.mq) { App.mq.end(true); App.mq = null; setMq('off'); return; }
  const mq = App.settings.mq;
  if ($('#mqUrl')) { mq.url = $('#mqUrl').value.trim(); mq.root = $('#mqRoot').value.trim(); mq.user = $('#mqUser').value; mq.pass = $('#mqPass').value; mq.auto = $('#mqAuto').checked; App.saveSettings(); }
  try {
    setMq('loading');
    if (!window.mqtt) await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js');
    setMq('connecting');
    const root = App.root();
    App.mq = window.mqtt.connect(mq.url, {clientId: 'app-' + Math.random().toString(16).slice(2, 10), username: mq.user || undefined, password: mq.pass || undefined, reconnectPeriod: 5000, connectTimeout: 10000});
    App.mq.on('connect', () => { App.mq.subscribe(root + '/tu/+/+'); setMq('on'); });
    App.mq.on('message', (topic, buf) => { const text = buf.toString(); Bus.log(topic, text); App.onMessage(topic, text, 'mqtt'); });
    App.mq.on('error', () => setMq('err'));
    App.mq.on('offline', () => setMq('retry'));
  } catch (err) { App.mq = null; setMq('err'); toast('Không tải được thư viện MQTT (kiểm tra mạng)'); }
}

let energySaveTick = 0;
function loop() {
  if (App.settings.demo) {
    Clock.ms += 1000 * Clock.speed;
    const d = new Date(Clock.ms);
    $('#simTime').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    $('#dayIcon').textContent = inWindow(Clock.min(), 1080, 330) ? '🌙' : '☀️';
    if (App.inited) Object.values(App.devices).forEach(dev => dev.step());
    if (App.random && --App.randomTimer <= 0) {
      App.randomTimer = Math.round(rnd(25, 45));
      const devs = Object.values(App.devices).filter(d => d.cab.order && d.cab.order.length > 6), dev = pick(devs);
      const k = pick(['cut', 'cut', 'cut', 'lamp', 'crash', 'door', 'offline', 'kfail1', 'cbTrip']);
      if (['cut', 'lamp', 'crash'].includes(k)) {
        const i2 = dev.cab.order[Math.floor(rnd(1, dev.cab.order.length - 1))]; applyPoleFault(i2, k);
        setTimeout(() => { applyPoleFault(i2, 'clear'); dev.f.cbTrip = false; }, rnd(60, 120) * 1000);
      } else { applySimFault(dev, k, true); setTimeout(() => applySimFault(dev, k, false), rnd(40, 90) * 1000); }
    }
  }
  const now = Date.now();
  App.visibleCabs().forEach(c => {
    Object.keys(c.active).forEach(k => { if (c.active[k].exp && c.active[k].exp < now) delete c.active[k]; });
    if (c.online && c.tele && now - c.lastSeen > CFG.OFFLINE_AFTER_S * 1000) App.markOffline(c, `Không nhận được dữ liệu quá ${CFG.OFFLINE_AFTER_S} giây`);
  });
  if (App.energyDirty && ++energySaveTick >= 30) { energySaveTick = 0; App.energyDirty = false; App.saveEnergy(); }
  updateHeader();
  if (route().tab === '3d') V3.tick();
  if (route().r === 'ban-do') G3.tick();
  render(false);
  Bus.flush();

   12. SƠ ĐỒ TỦ 3D + PHÂN ĐOẠN SỰ CỐ
   Mỗi bộ phận trong tủ là một "phân đoạn". Cảnh báo được gắn vào phân đoạn
   tương ứng: bộ phận nhấp nháy đỏ + nhãn nổi, bảng phân đoạn bên dưới.

const SEGS = [
  {id: 'nguon', icon: '⚡', name: 'Nguồn vào & điện lưới'},
  {id: 'cb', icon: '🔻', name: 'CB tổng'},
  {id: 'spd', icon: '🌩️', name: 'Chống sét (SPD)'},
  {id: 'meter', icon: '📟', name: 'Đo đếm (đồng hồ + CT)'},
  {id: 'k1', icon: '🧲', name: 'Contactor K1'}, {id: 'k2', icon: '🧲', name: 'Contactor K2'},
  {id: 'k3', icon: '🧲', name: 'Contactor K3'}, {id: 'k4', icon: '🧲', name: 'Contactor K4'},
  {id: 'gateway', icon: '📡', name: 'Gateway & kết nối 4G'},
  {id: 'selector', icon: '✋', name: 'Công tắc Tay/Tự động'},
  {id: 'door', icon: '🚪', name: 'Cửa tủ'},
  {id: 'vo', icon: '💥', name: 'Vỏ tủ & móng'},
  {id: 'capA', icon: '✂️', name: 'Tuyến cáp pha A'}, {id: 'capB', icon: '✂️', name: 'Tuyến cáp pha B'}, {id: 'capC', icon: '✂️', name: 'Tuyến cáp pha C'},
  {id: 'den', icon: '💡', name: 'Tuyến đèn'}
];
function segOf(code, ph) {
  switch (code) {
    case 'CAT_CAP': return /^[ABC]$/.test(ph) ? 'cap' + ph : 'den';
    case 'CB_NHANH': case 'MAT_DIEN_TUYEN': case 'HONG_BONG': case 'GHI_NHAN': return 'den';
    case 'MAT_PHA': case 'MAT_DIEN': case 'DIEN_AP': return 'nguon';
    case 'CB_TONG': return 'cb';
    case 'SPD': return 'spd';
    case 'LOI_DONG_HO': return 'meter';
    case 'K_KHONG_DONG': case 'K_KHONG_CAT': return 'k' + ph;
    case 'KHONG_SANG': case 'SANG_NGAY': return 'den';
    case 'MO_CUA': return 'door';
    case 'VA_CHAM': case 'NGHIENG': return 'vo';
    case 'CHE_DO_TAY': return 'selector';
    case 'MAT_KET_NOI': return 'gateway';
    default: return null;
  }
}
function segName(cab, id) {
  if (/^k[1-4]$/.test(id)) return 'Contactor ' + cab.cfg.doNames[+id[1] - 1];
  return SEGS.find(s => s.id === id)?.name || id;
}
// Trạng thái từng phân đoạn: cảnh báo đang hoạt động + sự cố chưa xong
function segStatus(cab) {
  const out = {};
  SEGS.forEach(s => { out[s.id] = {live: [], inc: [], sev: 0}; });
  Object.values(cab.active).forEach(a => {
    const id = segOf(a.code, a.phase); if (!id || !out[id]) return;
    out[id].live.push(a); out[id].sev = Math.max(out[id].sev, ALARM[a.code]?.sev || 1);
  });
  App.incidents.filter(x => x.cab === cab.cfg.key && x.status !== 'done').forEach(x => {
    const ids = x.phases.length ? x.phases.map(p => segOf(x.code, p)) : [segOf(x.code, '-')];
    [...new Set(ids)].forEach(id => {
      if (!id || !out[id]) return;
      out[id].inc.push(x); out[id].sev = Math.max(out[id].sev, ALARM[x.code]?.sev || 1);
    });
  });
  return out;
}
function segDetail(cab, id) {
  const t = cab.tele || {}, v = t.v || [], i = t.i || [], di = t.di || [], d = t.do || [], sch = t.sch || DEF_SCHED;
  const P = 'ABC';
  if (id === 'nguon') return `Điện áp: ${[0, 1, 2].map(k => `${P[k]} ${num(v[k], 0)} V`).join(' · ')} · tần số ${num(t.f, 2)} Hz`;
  if (id === 'cb') return `CB tổng: <b>${di[DI.CB] === undefined ? '—' : di[DI.CB] ? 'Đóng' : 'Cắt / nhảy'}</b>`;
  if (id === 'spd') return `Chống sét: <b>${di[DI.SPD] === undefined ? '—' : di[DI.SPD] ? 'Tốt' : 'Hỏng'}</b>`;
  if (id === 'meter') return [0, 1, 2].map(k => `${P[k]}: ${num(v[k], 0)} V · ${num(i[k], 2)} A · ${num((t.p || [])[k], 0)} W`).join('<br>') + `<br>Chỉ số: ${num(t.kwh, 1)} kWh`;
  if (/^k[1-4]$/.test(id)) {
    const c = +id[1] - 1, fb = FB_OF_DO[c] >= 0 ? di[FB_OF_DO[c]] : undefined, s = sch[c] || [0, 0, 0];
    return `Lệnh: <b>${d[c] ? 'Đóng' : 'Cắt'}</b>${fb !== undefined ? ` · Phản hồi: <b>${fb ? 'Đóng' : 'Mở'}</b>${fb !== d[c] ? ' <b style="color:var(--bad)">⚠ lệch</b>' : ''}` : ''} · Lịch ${s[0] ? hm(s[1]) + '→' + hm(s[2]) : 'tắt'}`;
  }
  if (id === 'gateway') return `${cab.online ? '🟢 Đang kết nối' : '🔴 Mất kết nối'} · sóng ${num(t.rssi, 0)} dBm · hàng đợi ${t.q ?? '—'} · thẻ SD ${t.sd ? 'OK' : '—'}`;
  if (id === 'selector') return `Công tắc tại tủ: <b>${di[DI.AUTO] === undefined ? '—' : di[DI.AUTO] ? 'Tự động' : 'Tay'}</b>`;
  if (id === 'door') return `Cửa: <b>${di[DI.DOOR] ? 'Mở' : 'Đóng'}</b> · Bảo trì: ${t.maint ? 'bật' : 'tắt'}`;
  if (id === 'vo') return `Độ nghiêng: <b>${num(t.tilt, 1)}°</b> (báo khi > ${CFG.TILT_ALARM}°)`;
  if (/^cap[ABC]$/.test(id)) { const k = P.indexOf(id[3]); return `Pha ${id[3]}: ${num(i[k], 2)} A · ${num(v[k], 0)} V`; }
  if (id === 'den') return `Kênh đang sáng: ${cab.cfg.doNames.filter((n, c) => d[c]).map(n => n.split('·')[0].trim()).join(', ') || 'không'} · tổng dòng ${num(i.reduce((a, b) => a + (b || 0), 0), 1)} A`;
  return '';
}
function incLine(x) {
  const info = ALARM[x.code];
  return `${esc(x.no)} · ${info.icon} ${esc(info.label)}${x.phases.length ? ' ' + x.phases.map(p => phaseLabel(x.code, p)).join(',') : ''} · ${STATUS[x.status]} · ${esc(x.team)} · ${fmtTime(x.at)}${x.cleared ? ' · thiết bị báo đã hết' : ''}`;
}
function segReport(cab) {
  const st = segStatus(cab), bad = SEGS.filter(s => st[s.id].sev > 0);
  let r = `BÁO CÁO PHÂN ĐOẠN – ${cab.cfg.id} ${cab.cfg.name} (${cab.cfg.area})\nLúc: ${fmtTime(App.nowFor(cab))}\n`;
  r += `Có sự cố: ${bad.length}/${SEGS.length} phân đoạn\n\n`;
  SEGS.forEach(s => {
    const x = st[s.id];
    if (!x.sev) { r += `✅ ${segName(cab, s.id)}: bình thường\n`; return; }
    r += `⚠️ ${segName(cab, s.id)}:\n`;
    x.inc.forEach(i => { r += `   - ${incLine(i).replace(/<[^>]+>/g, '')}\n`; });
    x.live.filter(a => !x.inc.some(i => i.code === a.code)).forEach(a => { r += `   - ${ALARM[a.code].label} (đang báo)\n`; });
  });
  return r;
}

const V3 = {
  renderer: null, scene: null, camera: null, key: null, running: false, sel: null, seeThrough: true,
  cam: {theta: 0.62, phi: 1.13, r: 6.4, tx: 1.7, ty: 1.0, tz: 0.5}, goal: null,
  seg: {}, anchors: {}, markers: {}, P: {}, lastTele: null, pts: new Map(), down: null,

  async load() {
    if (window.THREE) return true;
    try { await loadScript('vendor/three.min.js'); } catch (e) { /* thử CDN */ }
    if (!window.THREE) { try { await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'); } catch (e) { /* bỏ qua */ } }
    return !!window.THREE;
  },
  async mount(cab, focus) {
    if (!document.getElementById('v3d')) return;
    if (!await this.load()) { const b = document.getElementById('v3d'); if (b) b.innerHTML = '<div class="empty">Không tải được thư viện 3D – kiểm tra kết nối mạng.</div>'; return; }
    const box = document.getElementById('v3d'); if (!box) return;
    if (!this.renderer) this.init();
    if (this.key !== cab.cfg.key) this.build(cab);
    box.innerHTML = ''; box.appendChild(this.renderer.domElement);
    this.resize();
    if (this.needHome) { this.needHome = false; this.home(true); }
    if (focus) this.select(focus);
    if (!this.running) { this.running = true; requestAnimationFrame(t => this.frame(t)); }
    this.tick();
  },
  init() {
    const T = THREE;
    this.renderer = new T.WebGLRenderer({antialias: true});
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.outputEncoding = T.sRGBEncoding;
    this.camera = new T.PerspectiveCamera(42, 1, 0.05, 120);
    this.ray = new T.Raycaster();
    const el = this.renderer.domElement;
    el.style.touchAction = 'none'; el.style.display = 'block'; el.style.width = '100%'; el.style.height = '100%';
    el.setAttribute('aria-label', 'Mô hình 3D tủ điện – kéo để xoay, chụm hai ngón để phóng to');
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId); this.pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
      this.down = {x: e.clientX, y: e.clientY, t: Date.now()}; this.goal = null;
    });
    el.addEventListener('pointermove', e => {
      const p = this.pts.get(e.pointerId); if (!p) return;
      if (this.pts.size === 1) {
        this.cam.theta -= (e.clientX - p.x) * 0.008;
        this.cam.phi = Math.min(1.5, Math.max(0.3, this.cam.phi - (e.clientY - p.y) * 0.006));
      } else if (this.pts.size === 2) {
        const [a, b] = [...this.pts.values()], d0 = Math.hypot(a.x - b.x, a.y - b.y);
        p.x = e.clientX; p.y = e.clientY;
        const [c, d] = [...this.pts.values()], d1 = Math.hypot(c.x - d.x, c.y - d.y);
        if (d0 > 0 && d1 > 0) this.cam.r = Math.min(16, Math.max(0.7, this.cam.r * d0 / d1));
      }
      p.x = e.clientX; p.y = e.clientY;
    });
    const up = e => {
      this.pts.delete(e.pointerId);
      if (this.down && e.type === 'pointerup' && Math.hypot(e.clientX - this.down.x, e.clientY - this.down.y) < 7 && Date.now() - this.down.t < 450) this.pick(e);
      this.down = null;
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); this.goal = null; this.cam.r = Math.min(16, Math.max(0.7, this.cam.r * (e.deltaY > 0 ? 1.1 : 0.9))); }, {passive: false});
  },
  resize() {
    const el = this.renderer.domElement.parentElement; if (!el) return;
    const w = el.clientWidth, h = el.clientHeight;
    this.renderer.setSize(w, h, false); this.camera.aspect = w / Math.max(1, h); this.camera.updateProjectionMatrix();
  },

  /* ---------- Dựng cảnh ---------- */
  mat(color, o) { return new THREE.MeshStandardMaterial(Object.assign({color, roughness: 0.65, metalness: 0.1}, o || {})); },
  add(geo, color, x, y, z, parent, seg, o) {
    const m = new THREE.Mesh(geo, this.mat(color, o));
    m.position.set(x, y, z); parent.add(m);
    if (seg) { m.userData.seg = seg; (this.seg[seg] = this.seg[seg] || []).push(m); m.material.userData.base = m.material.emissive.getHex(); }
    return m;
  },
  box(w, h, d, color, x, y, z, parent, seg, o) { return this.add(new THREE.BoxGeometry(w, h, d), color, x, y, z, parent, seg, o); },
  tube(points, r, color, parent, seg, o) {

  label(text, w, h, parent, x, y, z, o = {}) {

      this.tube([[x, 0.79, -0.1], [x, 0.62, -0.08], [0.0 + (c - 1.5) * 0.12, 0.52, -0.08]], 0.008, '#4b4f55', G, id);

    // CB → CT → thanh cái

    // Cáp ra đường: đoạn trước điểm cắt + đoạn sau điểm cắt

    this.P.outA = []; this.P.outB = []; this.P.cut = [];
    [0, 1, 2].forEach(k => {
      const z = 0.85 + k * 0.08, id = 'cap' + 'ABC'[k];
      this.P.outA.push(this.tube([[(k - 1) * 0.15, 0.48, -0.1], [0.25 + k * 0.05, 0.25, -0.05], [0.45, 0.02, 0.3 + k * 0.05], [1.0, 0.02, z], [CUT - 0.06, 0.02, z]], 0.014, PH[k], S, id));

      ball.visible = false; this.P.cut.push(ball);
      this.anchors[id] = new T.Vector3(CUT, 0.45 + k * 0.32, z);

    // Cột đèn: K1 / K2 xen kẽ, pha A-B-C xoay vòng

    for (let n = 0; n < 6; n++) {
      const x = 1.9 + n * 1.45, ch = n % 2, ph = n % 3;

      const head = this.box(0.16, 0.06, 0.32, '#3b3f45', x, 2.95, 1.78, S, 'den', {emissive: '#000000'});
      head.userData.hl = false;
      const cone = new T.Mesh(new T.ConeGeometry(0.75, 2.9, 24, 1, true), new T.MeshBasicMaterial({color: 0xfff1a8, transparent: true, opacity: 0.18, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide}));

      const tag = this.label(`${cab.cfg.doNames[ch].split('·')[0].trim()} · pha ${'ABC'[ph]}`, 0.5, 0.11, S, x, 1.0, 1.395, {bg: 'rgba(255,255,255,.9)', fg: '#17212b'});
      tag.userData.seg = 'den';
      this.P.posts.push({head, cone, ch, ph});
    }

    // Cây trang trí (K3)

    this.box(0.08, 0.3, 0.08, '#6b4a2b', -1.2, 0.15, 1.2, S, 'den');
    this.P.garland = [];
    for (let n = 0; n < 9; n++) {
      const a = n * 1.9, h = 0.35 + n * 0.08, r = 0.33 - n * 0.032;
      const b = this.add(new T.SphereGeometry(0.025, 8, 8), '#555', -1.2 + Math.cos(a) * r, h, 1.2 + Math.sin(a) * r, S, null, {emissive: '#000'});

    // ---- Cửa tủ (bản lề bên trái) ----
    const door = this.door = new T.Group(); door.position.set(-0.6, 1.0, 0.226); G.add(door);
    this.P.doorPanel = this.box(1.2, 1.6, 0.02, '#c9cfd6', 0.6, 0, 0.01, door, 'door', {transparent: true});

    this.label('⚡ NGUY HIỂM ĐIỆN CAO ÁP', 0.6, 0.08, door, 0.6, 0.46, 0.022, {bg: '#f2b705', fg: '#17212b', size: 0.5});
    this.P.pilots = [0, 1, 2].map(k => this.add(new T.SphereGeometry(0.03, 12, 12), PH[k], 0.42 + k * 0.18, 0.28, 0.035, door, null, {emissive: PH[k], emissiveIntensity: 0.9}));
    const sw = this.P.selector = new T.Group(); sw.position.set(0.6, 0.05, 0.04); door.add(sw);
    this.add(new T.CylinderGeometry(0.06, 0.06, 0.03, 20), '#222', 0, 0, 0, sw, 'selector').rotation.x = Math.PI / 2;
    this.box(0.025, 0.1, 0.03, '#d63a3a', 0, 0, 0.025, sw, 'selector');
    this.label('TAY      TỰ ĐỘNG', 0.32, 0.05, door, 0.6, 0.15, 0.022, {fg: '#17212b', size: 0.6});
    this.doorAngle = 0;

    // Nhãn cảnh báo nổi
    SEGS.forEach(s => {
      const m = this.sprite(segName(cab, s.id).replace('Contactor ', ''), '#d63a3a', 0.042);
      m.userData.seg = s.id; m.visible = false; S.add(m); this.markers[s.id] = m;
    });
    this.needHome = true;
  },

  /* ---------- Dòng điện chạy trong dây ----------
     Mỗi đoạn dây là một "luồng": hạt sáng chạy từ nguồn về tải.
     Tốc độ và mật độ hạt tỉ lệ với dòng điện đo được (A). */
  glowTex() {
    if (this._glow) return this._glow;
    const t = this.canvasTex(64, 64, g => {
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,.85)'); r.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    });
    return (this._glow = t.tex);
  },
  buildFlow(PH, wx) {
    const T = THREE, V = a => new T.Vector3(...a);
    const curveOf = pts => new T.CatmullRomCurve3(pts.map(V), false, 'catmullrom', 0.1);
    this.flows = []; this.showFlow = this.showFlow !== false;
    const add = (curve, inCab, color, getI, speed, dens) => {
      const len = curve.getLength(), n = Math.max(4, Math.min(60, Math.round(len * dens)));
      this.flows.push({curve, inCab, col: new T.Color(color), getI, speed, len, n, ph: Math.random()});
    };
    // Lưới → CB, CB → CT → thanh cái (3 pha)
    [0, 1, 2].forEach(k => {
      add(this.P.inCable[k].userData.curve, true, PH[k], c => c.vOk[k] ? c.i[k] : 0, 1.6, 9);
      add(this.P.mid[k].userData.curve, true, PH[k], c => c.i[k], 1, 24);
    });
    // Thanh cái → qua contactor → hàng kẹp (dòng mỗi kênh: ước tính theo tỉ lệ tải)
    this.P.kx.forEach((x, c) => add(curveOf([[x, 1.07 + 0.044, -0.1], [x, 1.03, -0.06], [x, 0.9, -0.035], [x, 0.8, -0.06], [x, 0.7, -0.09], [x, 0.62, -0.08], [(c - 1.5) * 0.12, 0.52, -0.08]]),
      true, '#ffe08a', ctx => ctx.kI[c], 1, 26));
    // Cáp ra đường: trước và sau điểm nghi cắt
    [0, 1, 2].forEach(k => {
      add(this.P.outA[k].userData.curve, false, PH[k], c => c.i[k], 3.2, 3.2);
      add(this.P.outB[k].userData.curve, false, PH[k], c => c.cut[k] ? 0 : c.i[k], 3.2, 2.6);
    });
    // Từ cáp ngầm leo lên cột tới bóng đèn
    this.P.posts.forEach((p, n) => {
      const x = 1.9 + n * 1.45, z = 0.85 + p.ph * 0.08;
      add(curveOf([[x, 0.03, z], [x + 0.05, 0.04, 1.3], [x + 0.05, 0.4, 1.33], [x + 0.05, 2.85, 1.33], [x, 2.99, 1.55], [x, 2.95, 1.76]]),
        false, PH[p.ph], ctx => ctx.postI[n], 2.2, 3.5);
    });
    const mk = (inCab, size) => {
      const list = this.flows.filter(f => f.inCab === inCab); let off = 0;
      list.forEach(f => { f.off = off; off += f.n; });
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(new Float32Array(off * 3), 3));
      geo.setAttribute('color', new T.BufferAttribute(new Float32Array(off * 3), 3));
      const pts = new T.Points(geo, new T.PointsMaterial({size, map: this.glowTex(), vertexColors: true, transparent: true, depthWrite: false, blending: T.AdditiveBlending}));
      pts.frustumCulled = false; pts.renderOrder = 5;
      (inCab ? this.cabG : this.scene).add(pts);
      list.forEach(f => { f.geo = geo; });
      return pts;
    };
    mk(true, 0.032); mk(false, 0.1);
    // Tia lửa tại điểm nghi cắt cáp
    const NS = 48, sg = new T.BufferGeometry();
    sg.setAttribute('position', new T.BufferAttribute(new Float32Array(NS * 3), 3));
    sg.setAttribute('color', new T.BufferAttribute(new Float32Array(NS * 3), 3));
    const sp = new T.Points(sg, new T.PointsMaterial({size: 0.07, map: this.glowTex(), vertexColors: true, transparent: true, depthWrite: false, blending: T.AdditiveBlending}));
    sp.frustumCulled = false; this.scene.add(sp);
    this.sparks = {geo: sg, p: Array.from({length: NS}, () => ({x: 0, y: -9, z: 0, vx: 0, vy: 0, vz: 0, life: 0}))};
    // Nhãn số ampe trên cáp ra
    this.P.ampTags = [0, 1, 2].map(k => {
      const t = this.canvasTex(320, 80, (g, W, H, txt) => {
        g.clearRect(0, 0, W, H); g.fillStyle = 'rgba(12,18,28,.82)';
        g.beginPath(); if (g.roundRect) g.roundRect(2, 2, W - 4, H - 4, 22); else g.rect(2, 2, W - 4, H - 4); g.fill();
        g.fillStyle = PH[k]; g.beginPath(); g.arc(38, H / 2, 14, 0, 7); g.fill();
        g.fillStyle = '#fff'; g.font = '700 38px system-ui'; g.textBaseline = 'middle'; g.fillText(txt || `Pha ${'ABC'[k]}`, 64, H / 2 + 2);
      });
      const s = new T.Sprite(new T.SpriteMaterial({map: t.tex, depthTest: false, transparent: true, sizeAttenuation: false}));
      s.scale.set(0.1, 0.025, 1); s.renderOrder = 9;
      s.position.set(1.3 + k * 0.75, 0.3, 0.85 + k * 0.08); this.scene.add(s);
      return {s, t};
    });
  },
  updateFlow(ctx, dt) {
    const tmp = this._tmpV || (this._tmpV = new THREE.Vector3()), geos = new Set();
    for (const f of this.flows) {
      const I = Math.max(0, f.getI(ctx) || 0);
      const nVis = this.showFlow && I > CFG.I_ZERO ? Math.max(3, Math.round(f.n * Math.min(1, 0.25 + I / 4))) : 0;
      f.ph = (f.ph + dt * (0.1 + Math.min(I, 10) * 0.07) * f.speed / f.len) % 1;
      const pos = f.geo.attributes.position.array, col = f.geo.attributes.color.array;
      for (let j = 0; j < f.n; j++) {
        const o = (f.off + j) * 3;
        if (j < nVis) {
          f.curve.getPointAt((f.ph + j / nVis) % 1, tmp);
          pos[o] = tmp.x; pos[o + 1] = tmp.y; pos[o + 2] = tmp.z;
          const b = 0.75 + 0.25 * Math.sin((f.ph + j / nVis) * 40);
          col[o] = f.col.r * b; col[o + 1] = f.col.g * b; col[o + 2] = f.col.b * b;
        } else { col[o] = col[o + 1] = col[o + 2] = 0; pos[o + 1] = -50; }
      }
      geos.add(f.geo);
    }
    geos.forEach(g => { g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true; });
    // Tia lửa
    const S = this.sparks, sp = S.geo.attributes.position.array, sc = S.geo.attributes.color.array;
    const cuts = [0, 1, 2].filter(k => ctx.cut[k] && ctx.vOk[k]);
    S.p.forEach((p, n) => {
      p.life -= dt;
      if (p.life <= 0 && cuts.length && this.showFlow && Math.random() < 0.35) {
        const k = cuts[n % cuts.length];
        Object.assign(p, {x: 3.3 - 0.06, y: 0.05, z: 0.85 + k * 0.08, vx: rnd(-0.6, 0.8), vy: rnd(0.6, 1.6), vz: rnd(-0.6, 0.6), life: rnd(0.25, 0.6)});
      }
      if (p.life > 0) { p.vy -= 4 * dt; p.x += p.vx * dt; p.y = Math.max(0.02, p.y + p.vy * dt); p.z += p.vz * dt; }
      sp[n * 3] = p.x; sp[n * 3 + 1] = p.life > 0 ? p.y : -50; sp[n * 3 + 2] = p.z;
      const b = Math.max(0, p.life) * 2;
      sc[n * 3] = b; sc[n * 3 + 1] = 0.7 * b; sc[n * 3 + 2] = 0.2 * b;
    });
    S.geo.attributes.position.needsUpdate = true; S.geo.attributes.color.needsUpdate = true;
  },

  /* ---------- Camera ---------- */
  home(now) {
    const el = this.renderer && this.renderer.domElement.parentElement, portrait = el && el.clientWidth < el.clientHeight * 1.1;
    const g = portrait ? {theta: 0.5, phi: 1.12, r: 7.8, tx: 1.1, ty: 1.1, tz: 0.6} : {theta: 0.62, phi: 1.13, r: 6.0, tx: 1.4, ty: 1.0, tz: 0.6};
    if (now) Object.assign(this.cam, g); else this.goal = g;
  },
  anchorPos(id) {
    if (id === 'door') return this.door.localToWorld(new THREE.Vector3(1.1, 0.3, 0.1));
    if (id === 'selector') return this.door.localToWorld(new THREE.Vector3(0.6, 0.25, 0.1));
    const a = this.anchors[id]; if (!a) return new THREE.Vector3();
    return /^cap|nguon|den/.test(id) ? a.clone() : this.cabG.localToWorld(a.clone());
  },
  select(id) {
    if (!this.scene || !SEGS.some(s => s.id === id)) return;
    this.sel = id;
    const p = this.anchorPos(id);
    const far = {nguon: 3.6, den: 5.5, vo: 3.2, door: 2.4, selector: 1.6, capA: 3, capB: 3, capC: 3}[id] || 1.35;
    const phi = /^cap/.test(id) ? 0.85 : 1.25, theta = /^cap|den/.test(id) ? 0.35 : 0.3;
    this.goal = {theta, phi, r: far, tx: p.x, ty: /^cap/.test(id) ? 0.1 : p.y - (id === 'den' ? 1.6 : 0.12), tz: p.z};
    this.tick();
  },
  pick(e) {
    const r = this.renderer.domElement.getBoundingClientRect();
    const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    this.ray.setFromCamera(v, this.camera); this.ray.camera = this.camera;
    const hits = this.ray.intersectObjects(this.scene.children, true);
    for (const h of hits) {
      let o = h.object;
      while (o && !o.userData.seg) o = o.parent;
      if (o && (o.visible !== false)) { this.select(o.userData.seg); return; }
    }
  },

  /* ---------- Vòng vẽ ---------- */
  frame(ts) {
    if (!this.renderer || !document.body.contains(this.renderer.domElement)) { this.running = false; this._lt = 0; return; }
    const time = ts / 1000, c = this.cam;
    if (this.goal) {
      let done = true;
      for (const k in this.goal) { const d = this.goal[k] - c[k]; c[k] += d * 0.09; if (Math.abs(d) > 0.002) done = false; }
      if (done) this.goal = null;
    }
    this.camera.position.set(c.tx + c.r * Math.sin(c.phi) * Math.sin(c.theta), c.ty + c.r * Math.cos(c.phi), c.tz + c.r * Math.sin(c.phi) * Math.cos(c.theta));
    this.camera.lookAt(c.tx, c.ty, c.tz);
    this.update(time);
    this.renderer.render(this.scene, this.camera);
    requestAnimationFrame(t => this.frame(t));
  },
  update(time) {
    const cab = App.cabs[this.key]; if (!cab) return;
    const t = cab.tele || {}, v = t.v || [], i = t.i || [], di = t.di || [], d = t.do || [];
    const st = this.st || (this.st = segStatus(cab));
    const pulse = 0.5 + 0.5 * Math.sin(time * 7);
    const night = App.settings.demo && cab.cfg.source === 'sim' ? inWindow(Clock.min(), 1080, 330) : (h => h >= 18 || h < 6)(new Date().getHours());
    this.scene.background = new THREE.Color(night ? '#0e1828' : '#cfe3f5');
    this.hemi.intensity = night ? 0.45 : 0.95; this.sun.intensity = night ? 0.25 : 0.8;

    // Nguồn vào + đèn báo pha trên cửa
    [0, 1, 2].forEach(k => {
      const live = v[k] !== null && v[k] !== undefined && v[k] >= CFG.V_LOST;
      const m = this.P.inCable[k].material;
      m.color.set(live ? [cssVar('--pa'), cssVar('--pb'), cssVar('--pc')][k] : '#6b7480');
      m.emissive.set(live ? m.color : '#000000'); m.emissiveIntensity = live ? 0.25 : 0;
      this.P.pilots[k].material.emissiveIntensity = live ? 0.9 : 0;
      if (!live) this.P.pilots[k].material.color.set('#555');
    });
    // CB, chống sét, contactor
    this.P.lever.rotation.x = di[DI.CB] === 0 ? 0.7 : -0.5;
    this.P.spdWin.material.color.set(di[DI.SPD] === 0 ? '#d63a3a' : '#1f9d55');
    this.P.flags.forEach((f, c) => {
      const fb = FB_OF_DO[c] >= 0 ? di[FB_OF_DO[c]] : d[c];
      const bad = FB_OF_DO[c] >= 0 && d[c] !== undefined && fb !== d[c];
      f.material.color.set(bad ? '#d63a3a' : fb ? '#2ecc71' : '#8a96a3');
      f.material.emissive.set(bad || fb ? f.material.color : '#000'); f.material.emissiveIntensity = bad ? pulse : fb ? 0.5 : 0;
    });
    // Màn hình đồng hồ: chỉ vẽ lại khi có số liệu mới
    if (t !== this.lastTele) {
      this.lastTele = t; this.st = segStatus(cab);
      this.P.meterScr.forEach((s, k) => s.draw(t.v ? [`${num(v[k], 1)} V`, `${num(i[k], 2)} A`] : ['---.- V', '-.-- A']));
      if (this.P.ampTags) this.P.ampTags.forEach((a, k) => a.t.draw(`Pha ${'ABC'[k]}: ${num(i[k], 2)} A`));
    }
    this.P.led.material.color.set(cab.online ? '#2ecc71' : '#d63a3a');
    this.P.led.material.emissive.set(cab.online ? '#2ecc71' : '#d63a3a');
    this.P.led.material.emissiveIntensity = cab.online ? (Math.sin(time * 4) > 0 ? 1 : 0.2) : pulse;
    // Cáp ra + điểm nghi cắt
    [0, 1, 2].forEach(k => {
      const cut = !!cab.active['CAT_CAP' + 'ABC'[k]], on = i[k] > CFG.I_ZERO, col = [cssVar('--pa'), cssVar('--pb'), cssVar('--pc')][k];
      [this.P.outA[k], this.P.outB[k]].forEach((tb, j) => {
        const dead = cut && j === 1;
        tb.material.color.set(dead ? '#6b7480' : col);
        tb.material.emissive.set(on && !dead ? col : cut && j === 0 ? '#ff0000' : '#000');
        tb.material.emissiveIntensity = on && !dead ? 0.35 : cut && j === 0 ? pulse * 0.6 : 0;
      });
      this.P.cut[k].visible = cut; this.P.cut[k].scale.setScalar(0.8 + pulse * 0.6);
    });
    // Cột đèn và cây trang trí
    const closed = c => FB_OF_DO[c] >= 0 ? di[FB_OF_DO[c]] === 1 : d[c] === 1;
    // Dòng điện chạy trong dây
    const iA = [0, 1, 2].map(k => i[k] || 0), tot = iA.reduce((a, b) => a + b, 0);

  // Lớp chữ: tên phường, tên đường, mã tủ, tên trụ – chiếu từ toạ độ CAD, tránh chồng chữ

function gisLoading() {
  return `<div class="panel" style="margin:20px auto;max-width:520px;text-align:center"><h2>Đang tải dữ liệu LIGHTING-GIS</h2>
    <p class="sub" id="gisStep">${esc(LG.step || 'Đang kết nối…')}</p>${LG.err ? `<p class="sub" style="color:var(--bad)">Lỗi: ${esc(LG.err)}</p><button class="btn pri" data-act="gis-retry">Thử lại</button>` : '<p class="sub">Lần đầu khoảng 3 MB, các lần sau lấy từ bộ nhớ máy.</p>'}</div>`;
}
function mapSearch(q) {
  const box = document.getElementById('mapRes'); if (!box) return;
  App.mapQ = q; q = unaccent(q.trim());
  if (q.length < 2) { box.innerHTML = ''; return; }
  const out = [];
  for (const g of LG.cabs) { if (unaccent(`${g.id} ${g.name} ${g.addr} ${g.pe}`).includes(q)) out.push(`<button data-act="m-goto" data-cab="${g.t}"><b>🗄️ ${esc(g.id)}</b> ${esc(g.name)}<small>${esc(LG.QSHORT[g.q])} · ${esc(g.addr)}</small></button>`); if (out.length >= 7) break; }
  if (out.length < 10) for (let i = 0; i < LG.n && out.length < 12; i++) if (unaccent(LG.PN[i]).includes(q)) out.push(`<button data-act="m-goto" data-pole="${i}"><b>💡 ${esc(LG.PN[i])}</b><small>${esc(LG.byT[LG.PT[i]]?.id || '')} · ${esc(LG.street(i))}</small></button>`);
  box.innerHTML = out.join('') || '<div class="sub" style="padding:6px 8px">Không tìm thấy</div>';
}

/* ---------- SCADA: ô trạng thái tất cả tủ + sơ đồ một sợi của tủ đang chọn ---------- */
function viewScada() {
  if (!LG.ready) return gisLoading();
  const list = LG.cabs.filter(cabMatches);
  const order = {bad: 0, warn: 1, off: 2, ok: 3, none: 4};
  list.sort((a, b) => order[cabStatus(a.t)] - order[cabStatus(b.t)] || a.id.localeCompare(b.id));
  if (App.scSel === undefined || !LG.byT[App.scSel]) App.scSel = (list.find(g => g.poles.length) || list[0] || LG.cabs[0]).t;
  const cnt = s => list.filter(g => cabStatus(g.t) === s).length;
  return `<div class="row" style="margin-bottom:8px"><h1 class="grow" style="margin:0">SCADA</h1><a class="btn sm" href="#/ban-do">🗺️ Bản đồ</a></div>
    ${qChips('sc-q')}
    <div class="row" style="margin:8px 0"><input class="in grow" id="scQ" placeholder="Lọc tủ theo mã, tên, địa chỉ…" value="${esc(Filt.text)}" autocomplete="off" style="min-width:180px">
      <span class="sub">${list.length} tủ · <b style="color:var(--bad)">${cnt('bad')}</b> sự cố · <b style="color:var(--warn)">${cnt('warn')}</b> cảnh báo · ${cnt('off')} mất KN</span></div>
    <div class="tiles">${list.slice(0, 400).map(g => `<button class="tile s-${cabStatus(g.t)}${g.t === App.scSel ? ' sel' : ''}" data-act="sc-sel" data-t="${g.t}" title="${esc(g.name)}" style="--qc:${LG.QC[g.q]}">${esc(g.id)}</button>`).join('')}${list.length > 400 ? `<span class="sub">+${list.length - 400} tủ – lọc thêm để xem</span>` : ''}</div>
    <div class="scada">${scadaCab(App.scSel)}</div>
    <div class="slegend"><span><i style="background:${SC.feed}"></i>Nguồn có điện</span><span><i style="background:${SC.on}"></i>Có điện</span><span><i style="background:${SC.off}"></i>Không điện</span><span><i style="background:${SC.tr}"></i>CB nhảy</span><span><i style="background:${SC.bad}"></i>Nghi đứt / mất điện (ước tính)</span></div>
    <p class="sub">Chấm = trụ đèn theo thứ tự từ tủ (dữ liệu LIGHTING-GIS). Sáng/tắt là <b>ước tính từ dòng tổng của tủ</b> so với danh mục đèn. Bấm chấm để xem trên bản đồ.</p>`;
}
const SC = {on: '#f5a524', feed: '#36c5f0', off: '#4b5b6b', bad: '#f87171', tr: '#e879f9'};
function scadaCab(t) {
  const g = LG.byT[t]; if (!g) return '';
  const cab = gisCab(t), tl = cab && cab.online ? cab.tele || {} : {}, di = tl.di || [], dO = tl.do || [], v = tl.v || [];
  const live = v.some(x => x !== null && x >= CFG.V_LOST), cbOn = di[DI.CB] !== 0, k1 = FB_OF_DO[0] >= 0 ? di[FB_OF_DO[0]] === 1 : dO[0] === 1;
  const pw = live && cbOn, on = pw && k1, iSum = (tl.i || []).reduce((a, b) => a + (b || 0), 0);
  const calib = cab ? (Analyzer.st[cab.cfg.key] || {}).calib || 1 : 1, exp = g.exp * calib;
  const e = cabEst(t), dead = e.cut !== null && e.cut !== undefined ? inSubtree(g, e.cut) : new Set(), candSet = new Set(e.cand || []);
  const key = cab ? esc(cab.cfg.key) : '';
  const per = 30, dx = 30, rows = g.routes.reduce((s, r) => s + Math.ceil(r.poles.length / per), 0);
  const W = 1000, top = 270, H = top + rows * 30 + g.routes.length * 26 + 30;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ một sợi tủ ${esc(g.id)}">`;
  s += `<text x="20" y="34" class="s-tag">${esc(g.id)} · ${esc(g.name)}</text><text x="20" y="58" class="s-mut">${esc(LG.QNAME[g.q])} · ${esc(g.ward)} · ${esc(g.addr)} · ${cab ? (cab.online ? (tl.mode === 'remote' ? 'TỪ XA' : di[DI.AUTO] === 0 ? 'TAY' : 'TỰ ĐỘNG') : 'MẤT KẾT NỐI') : 'CHƯA KẾT NỐI'}</text>`;
  if (cab) s += `<a href="#/tu/${encodeURIComponent(cab.cfg.key)}/vao-ra"><text x="${W - 20}" y="34" text-anchor="end" class="s-val">Mở bảng tủ ›</text></a>`;
  // Nguồn → CB tổng → K1 → CT → cây trụ
  const y0 = 100;
  s += `<text x="20" y="${y0 + 5}" class="s-mut">Lưới 0,4 kV</text><line x1="120" y1="${y0}" x2="200" y2="${y0}" stroke="${live ? SC.feed : SC.off}" stroke-width="4"/>`;
  s += `<g class="click ${!cbOn ? 'blink' : ''}" data-act="sc-cb" data-key="${key}"><rect x="200" y="${y0 - 13}" width="26" height="26" rx="3" fill="${cbOn ? '#f1f5f9' : '#0b1219'}" stroke="${cbOn ? '#f1f5f9' : SC.tr}" stroke-width="2"/>${cbOn ? '' : `<line x1="205" y1="${y0 + 8}" x2="221" y2="${y0 - 8}" stroke="${SC.tr}" stroke-width="2"/>`}<text x="213" y="${y0 + 34}" text-anchor="middle" class="s-mut">CB tổng</text></g>`;
  s += `<line x1="226" y1="${y0}" x2="310" y2="${y0}" stroke="${pw ? SC.on : SC.off}" stroke-width="4"/>`;
  [0, 1].forEach(ch => {
    const fb = FB_OF_DO[ch] >= 0 ? di[FB_OF_DO[ch]] === 1 : dO[ch] === 1, cmd = dO[ch] === 1, bad = cab && cab.online && cmd !== fb;
    const x = 330 + ch * 110;
    s += `<g class="click ${bad ? 'blink' : ''}" data-act="sc-k" data-key="${key}" data-ch="${ch}"><circle cx="${x}" cy="${y0}" r="16" fill="${fb ? 'rgba(245,165,36,.18)' : '#0b1219'}" stroke="${bad ? SC.bad : fb ? SC.on : SC.off}" stroke-width="2.5"/><text x="${x}" y="${y0 + 5}" text-anchor="middle" class="s-tag" style="font-size:14px">K${ch + 1}</text><text x="${x}" y="${y0 + 36}" text-anchor="middle" class="s-mut">${ch ? 'Nửa đêm' : 'Cả đêm'}</text></g>`;
  });
  s += `<line x1="346" y1="${y0}" x2="${W - 40}" y2="${y0}" stroke="${on ? SC.on : SC.off}" stroke-width="4"/>`;
  s += `<circle cx="540" cy="${y0}" r="9" fill="none" stroke="#9fb3c6" stroke-width="2"/><text x="560" y="${y0 - 14}" class="s-val">I ${(tl.i || []).map(x => num(x, 1)).join(' / ')} A · Σ ${num(iSum, 1)} A</text>`;
  s += `<text x="560" y="${y0 + 24}" class="s-mut">GIS ≈ ${num(exp, 1)} A · ${on ? (exp - iSum > 0.5 * g.avgI ? `thiếu ${num(exp - iSum, 1)} A (≈${Math.round((exp - iSum) / g.avgI)} bóng)` : 'đủ') : '—'}</text><text x="560" y="${y0 + 46}" class="s-mut">${g.poles.length} trụ · cáp ${Math.round(g.len || 0)} m</text>`;
  if (e.cut !== null && e.cut !== undefined) {
    const w = LG.where(e.cut), k = w.indexOf(' – ');
    s += `<text x="20" y="${y0 + 82}" class="s-tag" style="fill:#f87171!important;font-size:15px">✂️ Nghi đứt ${esc(k > 0 ? w.slice(0, k) : w)}</text>`;
    s += `<text x="44" y="${y0 + 106}" class="s-mut" style="fill:#fca5a5!important">${esc(k > 0 ? w.slice(k + 3) : '')}${(e.cand || []).length > 1 ? ` · +${e.cand.length - 1} vị trí cùng mức dòng` : ''}</text>`;
  }
  else if (e.allDead) s += `<text x="20" y="${y0 + 82}" class="s-tag" style="fill:#f87171!important;font-size:15px">⚠ Đã đóng K1 nhưng không có dòng – nghi đứt cáp đầu tuyến</text>`;
  s += `<line x1="${W - 40}" y1="${y0}" x2="${W - 40}" y2="${top - 20}" stroke="${on ? SC.on : SC.off}" stroke-width="3"/>`;
  let y = top;
  if (!g.routes.length) s += `<text x="20" y="${y}" class="s-mut">Tủ này chưa có trụ đèn nào trong dữ liệu LIGHTING-GIS.</text>`;
  g.routes.forEach(r => {
    s += `<text x="20" y="${y}" class="s-tag" style="font-size:14px">${esc(r.name)}</text><text x="${W - 20}" y="${y}" text-anchor="end" class="s-mut">${r.poles.length} trụ · ${num(r.poles.reduce((a, i) => a + LG.PI[i], 0), 1)} A</text>`;
    y += 22;
    r.poles.forEach((i, k) => {
      const px = 30 + (k % per) * dx, py = y + Math.floor(k / per) * 30, isDead = dead.has(i) || e.allDead, lit = on && !isDead;
      const fill = lit ? 'rgba(255,233,166,.85)' : '#0b1219', stroke = candSet.has(i) ? '#ff3b3b' : isDead && on ? SC.bad : lit ? '#ffe9a6' : SC.off;
      const mk = App.incidents.some(x => x.status !== 'done' && x.mark && x.mark.pole === i);
      s += `<g class="click ${candSet.has(i) ? 'blink' : ''}" data-act="m-goto" data-pole="${i}"><title>${esc(LG.poleName(i))} · ${Math.round(LG.PD[i])} m</title><circle cx="${px}" cy="${py}" r="${candSet.has(i) ? 10 : 8}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>${mk ? `<text x="${px}" y="${py - 11}" text-anchor="middle" style="font-size:12px">📍</text>` : ''}</g>`;
      if (k % per) s += `<line x1="${px - dx + 8}" y1="${py}" x2="${px - 8}" y2="${py}" stroke="${isDead && on ? SC.bad : lit ? SC.on : SC.off}" stroke-width="2"/>`;
    });
    y += Math.ceil(r.poles.length / per) * 30 + 4;
  });
  return s + '</svg>';
}
function scadaK(key, ch) {
  const cab = App.cabs[key]; if (!cab) { toast('Tủ chưa kết nối'); return; }
  const t = cab.tele || {}, on = (t.do || [])[ch] === 1;
  openModal(`<h2>${esc(cab.cfg.id)} · ${esc(cab.cfg.doNames[ch])}</h2>
    <div class="sub">Lệnh: <b>${on ? 'ĐÓNG' : 'CẮT'}</b> · ${modeInfo(t).txt}</div>
    <div class="btns"><button class="btn ok" data-act="do" data-key="${esc(key)}" data-ch="${ch + 1}" data-val="1">💡 Đóng (bật)</button>
      <button class="btn" data-act="do" data-key="${esc(key)}" data-ch="${ch + 1}" data-val="0">⚫ Cắt (tắt)</button>
      <button class="btn" data-act="mode-auto" data-key="${esc(key)}">🕒 Về tự động</button><button class="btn" id="mNo">Đóng</button></div>`);
  $('#mNo').onclick = closeModal;
}
// Giả lập sự cố theo trụ trên mạng GIS (Demo)
function applyPoleFault(i, kind) {
  const g = LG.byT[LG.PT[i]]; if (!g) return;
  const d = App.devices[g.id]; if (!d) return;
  if (kind === 'cut') d.cuts.add(i);
  if (kind === 'lamp') d.fails.add(i);
  if (kind === 'crash') d.down = i;
  if (kind === 'clear') { d.cuts.delete(i); d.fails.delete(i); if (d.down === i) d.down = null; }
  if (kind === 'clearAll') { d.cuts.clear(); d.fails.clear(); d.down = null; }
  d.burst = 3;
}

/* ---------- Cài app (PWA) + góp ý ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').hidden = true; toast('✔ Đã cài app'); });
async function doInstall() {
  if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') $('#installBtn').hidden = true; installEvt = null; return; }
  if (window.matchMedia('(display-mode: standalone)').matches) { toast('App đang chạy ở chế độ đã cài'); return; }
  toast('Chrome/Edge: bấm biểu tượng ⊕ cuối thanh địa chỉ · Android: ⋮ → Thêm vào màn hình chính · iPhone: Chia sẻ → Thêm vào MH chính', 7000);
}
$('#installBtn').onclick = doInstall;
function feedbackUrl() {
  const page = 'Giám sát chiếu sáng – ' + decodeURIComponent(location.hash || '#/ban-do');
  const body = `**Trang đang xem:** ${page}\n**Thiết bị:** ${navigator.userAgent}\n**Màn hình:** ${innerWidth}×${innerHeight}\n\n### Góp ý / lỗi gặp phải\n\n\n### Mong muốn sửa thành\n\n\n_(Kéo thả ảnh chụp màn hình vào đây nếu có)_`;
  return 'https://github.com/Phucle-GPS/CSCC/issues/new?title=' + encodeURIComponent('Góp ý: ') + '&body=' + encodeURIComponent(body);
}
document.addEventListener('pointerdown', e => { const a = e.target.closest('#fbChip,#fbBtn'); if (a) a.href = feedbackUrl(); }, true);
document.addEventListener('focusin', e => { if (e.target.closest && e.target.closest('#fbChip,#fbBtn')) e.target.closest('#fbChip,#fbBtn').href = feedbackUrl(); });

/* ---------- Khởi động: tải LIGHTING-GIS rồi mới dựng tủ ---------- */
function startGis() {
  LG.load(step => { LG.step = step; const e = document.getElementById('gisStep'); if (e) e.textContent = step; })
    .then(() => { App.init(); render(true); LGSync.start(); })
    .catch(e => { LG.err = e.message || String(e); render(true); });
}
updateHeader();
render(true);
startGis();
setInterval(loop, 1000);
if (App.settings.mq.auto) mqToggle();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
