<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giám sát chiếu sáng</title>
<meta name="description" content="Phần mềm giám sát hệ thống chiếu sáng công cộng từ xa qua bản đồ 3D và SCADA, điều khiển tủ, quản lý sự cố.">
<meta name="theme-color" content="#1a6fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#17212b; --muted:#5f6b78; --line:#e2e7ed; --soft:#eef1f4;
  --accent:#1a6fd8; --accent-ink:#ffffff; --accent-bg:#e7f0fd;
  --ok:#1f9d55; --warn:#c77d00; --bad:#d63a3a; --off:#8a96a3;
  --ok-bg:#e6f6ec; --warn-bg:#fff4dc; --bad-bg:#fdeaea;
  --pa:#d6451f; --pb:#c99700; --pc:#2b6fd6; --lamp:#f2b705;
  --shadow:0 2px 10px rgba(16,30,50,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1419; --card:#18202a; --ink:#e7edf3; --muted:#9aa7b4; --line:#2a3542; --soft:#222c37;
    --accent:#4d9bff; --accent-ink:#06121f; --accent-bg:#14263d;
    --ok:#3ccf7d; --warn:#f0b13a; --bad:#ff6b6b; --off:#7d8996;
    --ok-bg:#12301f; --warn-bg:#33270c; --bad-bg:#3a1717;
    --pa:#ff7a52; --pb:#f2c53d; --pc:#5e9bff; --lamp:#ffd23f;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1419; --card:#18202a; --ink:#e7edf3; --muted:#9aa7b4; --line:#2a3542; --soft:#222c37;
  --accent:#4d9bff; --accent-ink:#06121f; --accent-bg:#14263d;
  --ok:#3ccf7d; --warn:#f0b13a; --bad:#ff6b6b; --off:#7d8996;
  --ok-bg:#12301f; --warn-bg:#33270c; --bad-bg:#3a1717;
  --pa:#ff7a52; --pb:#f2c53d; --pc:#5e9bff; --lamp:#ffd23f;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
a{color:var(--accent);text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}

/* ---------- Khung ---------- */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:9px 16px}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.hchip{display:flex;align-items:center;gap:6px;background:var(--soft);padding:5px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 24px}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.nav a{flex:1;text-align:center;padding:8px 2px 9px;font-size:11.5px;color:var(--muted);position:relative}
nav.nav a b{display:block;font-size:20px;line-height:1.25}
nav.nav a.on{color:var(--accent);font-weight:700}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;font-weight:700;line-height:17px}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:210px}
  nav.nav{top:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 10px 10px;gap:4px}
  nav.nav a{flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px}
  nav.nav a b{display:inline;font-size:18px}
  nav.nav a.on{background:var(--accent-bg)}
  nav.nav .badge{position:static;margin-left:auto}
  header{z-index:35;margin-left:-210px;padding-left:16px}
  .hwrap{max-width:none}
}

/* ---------- Thành phần ---------- */
h1{font-size:19px;margin:2px 0 12px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:5px solid var(--ok);display:block;color:inherit}
.card.s-bad{border-left-color:var(--bad)}.card.s-warn{border-left-color:var(--warn)}.card.s-off{border-left-color:var(--off)}
.cid{font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.acc{background:var(--accent-bg);color:var(--accent)}
.lamps{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.lamp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--muted);border:1px solid transparent}
.lamp i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.lamp.on{background:var(--warn-bg);color:var(--ink);border-color:var(--lamp)}
.lamp.on i{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
button.lamp{cursor:pointer;padding:5px 10px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph{background:var(--soft);border-radius:8px;padding:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.ph i{font-style:normal;font-weight:700;margin-right:4px}
.ph.zero{background:var(--bad-bg);color:var(--bad)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}.bar div{height:100%}
.alarms{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.tabs a,.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--ink);cursor:pointer}
.tabs a.on,.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.num,th.num{text-align:right}
.io{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.io:last-child{border-bottom:0}
.led{width:14px;height:14px;border-radius:50%;background:var(--off);flex:none}
.led.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.led.lampon{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch.on{background:var(--ok)}.switch.on::after{left:25px}
.switch.pending{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,select.in,input.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;max-width:100%}
input[type=time].in{padding:6px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
.cols>*{min-width:0}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
canvas{width:100%;height:170px;display:block;background:var(--soft);border-radius:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:5px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.faults{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.faults .btn{justify-content:flex-start;text-align:left;font-weight:500;font-size:13.5px}
.console{background:#0b1016;color:#b9e3c6;border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.console .t{color:#7fb2ff}.console .a{color:#ff9a8a}.console .s{color:#f2c53d}.console .c{color:#d6a8ff}
.inc .act{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 9px;margin-top:8px}
.inc .log{font-size:12px;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.modal{position:fixed;z-index:51;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:none}
.modal.on,.modal-bg.on{display:block}
@media (min-width:700px){.modal{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:480px;border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:min(92vw,520px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.back{display:inline-block;margin-bottom:6px;font-size:14px}
.ctl-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctl-row input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px}
.sticky-bar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border-radius:14px;box-shadow:0 -2px 14px rgba(0,0,0,.12);padding:10px 12px;margin-top:10px}
@media (min-width:900px){.sticky-bar{bottom:12px}}
pre.report{white-space:pre-wrap;background:var(--soft);padding:10px;border-radius:10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.v3wrap{padding:0;overflow:hidden;position:relative}
#v3d{height:min(62vh,560px);background:var(--soft)}
.v3legend{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11.5px;color:#fff;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:8px;max-width:calc(100% - 20px);pointer-events:none}
.v3legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;box-shadow:0 0 6px currentColor}
.v3legend em{font-style:normal;opacity:.85}
@media (max-width:560px){.v3legend em{display:none}}
.v3tools{position:absolute;top:44px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.v3hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px;max-width:calc(100% - 20px);pointer-events:none}
.v3info:not([hidden])~.v3hint,.v3hint:has(~.v3info:not([hidden])){display:none}
.v3info{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-height:48%;overflow:auto}
@media (min-width:900px){.v3info{right:auto;width:400px}}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media (max-width:600px){.hide-s{display:none}}
button.hchip{border:0;cursor:pointer}
/* ---------- Bản đồ 3D (toàn màn hình) ---------- */
body.fullmap main{max-width:none;padding:0}
.mapwrap{position:relative;height:calc(100vh - 57px - 66px - env(safe-area-inset-bottom));height:calc(100dvh - 57px - 66px - env(safe-area-inset-bottom));background:#141d27;overflow:hidden}
@media (min-width:900px){.mapwrap{height:calc(100vh - 57px);height:calc(100dvh - 57px)}}
#map3d{position:absolute;inset:0}
.mov{position:absolute;z-index:5;color:#dbe9f5;font-size:13px}
.mlegend{display:none;left:10px;top:10px;background:rgba(10,16,24,.8);border:1px solid #24384b;border-radius:10px;padding:6px 10px;font-size:11.5px;white-space:nowrap}
.mlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 9px;vertical-align:-1px}.mlegend i:first-child{margin-left:0}
.mtools{left:10px;top:56px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.mtools button,.mtools a{background:rgba(10,16,24,.85);border:1px solid #24384b;color:#dbe9f5;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.mtools .on{border-color:#36c5f0;color:#36c5f0}
.mlayers{left:10px;top:100px;background:rgba(10,16,24,.94);border:1px solid #24384b;border-radius:12px;padding:10px;width:290px;max-width:calc(100% - 20px)}
.mlayers .row{gap:6px;margin-bottom:8px}.mlayers button{background:#111b26;border:1px solid #24384b;color:#9fb3c6;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;cursor:pointer}
.mlayers .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mlayers .lgrid button.on{border-color:#36c5f0;color:#e6f7fd;background:#0f2a38}
.mlayers .lgrid button:not(.on){text-decoration:line-through;opacity:.7}.mlayers p{margin:8px 0 0;font-size:11px;color:#8aa2b8}
@media (max-width:760px){.mlayers{top:150px}}
.qchips{display:flex;gap:4px;flex-wrap:wrap}
.qchips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;border-left:4px solid var(--qc,var(--line))}
.qchips button small{font-weight:500;color:var(--muted);margin-left:4px}
.qchips button.on{background:var(--ink);color:var(--bg)}.qchips button.on small{color:inherit}
.mtools .qchips button{background:rgba(10,16,24,.85);border-color:#24384b;color:#dbe9f5}.mtools .qchips button.on{background:#dbe9f5;color:#0b1219}
.msearch{left:10px;top:10px;width:min(330px,calc(100% - 20px))}
.msearch input{width:100%;background:rgba(10,16,24,.9);border:1px solid #2c4256;color:#e6f2fb;border-radius:10px;padding:8px 11px;font-size:14px}
#mapRes{margin-top:4px;background:rgba(12,19,27,.96);border-radius:10px;overflow:hidden;max-height:50vh;overflow-y:auto}
#mapRes:empty{display:none}
#mapRes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #24384b;background:transparent;color:#dbe9f5;padding:7px 10px;cursor:pointer;font-size:13px}
#mapRes button small{display:block;color:#8aa2b8;font-size:11.5px}
.msrc{right:10px;bottom:10px;font-size:10.5px;color:#8aa2b8;background:rgba(10,16,24,.6);padding:2px 7px;border-radius:6px;pointer-events:none}
.msync{right:10px;bottom:34px;text-align:right;font-size:11px;color:#9fd8ea;background:rgba(10,16,24,.72);padding:3px 8px;border-radius:6px;max-width:calc(100% - 20px)}
.msync a{color:inherit;text-decoration:none}
@media (max-width:760px){.msrc{display:none}.msync{bottom:auto;right:auto;left:10px;top:188px;font-size:10.5px;text-align:left}}
.tiles{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px;max-height:240px;overflow:auto;padding:2px}
.tile{border:0;border-left:4px solid var(--qc);border-radius:6px;padding:4px 7px;font:600 11.5px ui-monospace,Menlo,monospace;cursor:pointer;background:#e6f6ec;color:#16653a}
.tile.s-bad{background:#fdeaea;color:#b42323;animation:blinkA 1s steps(2,start) infinite}.tile.s-warn{background:#fff4dc;color:#8a5a00}.tile.s-off,.tile.s-none{background:#eef1f4;color:#6b7785}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px;animation:none}
.mkpi{right:10px;top:10px;display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.mkpi>*{background:rgba(10,16,24,.85);border:1px solid #24384b;border-radius:10px;padding:5px 10px;color:#dbe9f5;text-decoration:none}
.mkpi span{display:block;font-size:10.5px;color:#8aa2b8}.mkpi b{font-size:16px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.mkpi{top:auto;bottom:10px;right:10px;left:10px;grid-template-columns:repeat(4,1fr)}.mkpi>*{padding:4px 7px;min-width:0}.mkpi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mkpi b{font-size:14px}}
.minfo{left:10px;bottom:10px;width:min(400px,calc(100% - 20px));background:rgba(12,19,27,.95);border:1px solid #24384b;border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.minfo .sub{color:#9bb0c3}.minfo .btn{background:#182533;border-color:#2c4256;color:#dbe9f5}.minfo .btn.pri{background:#36c5f0;border-color:#36c5f0;color:#06202c}
.minfo .lamp{background:#223142;color:#9bb0c3}.minfo .lamp.on{background:#43340e;color:#fff}
@media (max-width:760px){.minfo{bottom:68px}}
.mbanner{left:50%;transform:translateX(-50%);top:10px;display:flex;align-items:center;gap:8px;background:rgba(71,25,28,.95);border:1px solid #f87171;color:#ffe1e1;border-radius:10px;padding:6px 10px;max-width:min(560px,calc(100% - 20px))}
.mbanner[hidden],.minfo[hidden]{display:none}
.mbanner .btn{background:#2a1416;border-color:#f87171;color:#ffe1e1}.mbanner .btn.pri{background:#f87171;color:#2a0b0b}
@media (max-width:760px){.mbanner{top:auto;bottom:68px;left:10px;right:10px;transform:none;max-width:none}.minfo:not([hidden])~.mbanner{display:none}}
.mbanner .grow{min-width:0}
@media (min-width:761px) and (max-width:1100px){.mbanner{top:auto;bottom:10px;left:auto;right:10px;transform:none}}
/* ---------- SCADA ---------- */
.scada svg{width:100%;height:auto;display:block;background:#0b1219;border:1px solid #24384b;border-radius:12px}
.scada text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#b9cde0}
.s-tag{font-size:19px;font-weight:700;fill:#e6f2fb!important}.s-val{font-size:17px;fill:#7ee0ff!important}.s-mut{font-size:15px;fill:#8aa2b8!important}
.scada .click{cursor:pointer}.scada .click:hover>*{filter:brightness(1.35)}
.blink{animation:blinkA 1s steps(2,start) infinite}@keyframes blinkA{50%{opacity:.25}}
.slegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:8px 2px}
.slegend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}

];
const DEF_SCHED = [[1, 1080, 330], [1, 1080, 1380], [1, 1110, 1320], [0, 1080, 330]];
const SIM_SHARE = [0.6, 0.3, 0.1, 0];

const ALARM = {
  CAT_CAP:     {label: 'Nghi cắt / đứt cáp', sev: 3, icon: '✂️', act: 'Xem đoạn nghi đứt trên bản đồ. Cắt kênh để cô lập đầu cáp hở còn điện, cử tổ tới đúng đoạn; nếu mất cắp: báo công an phường, lập biên bản.'},
  VA_CHAM:     {label: 'Xe va chạm', sev: 3, icon: '💥', act: 'Kiểm tra trụ/tủ, chụp ảnh, ghi biển số xe và thông tin người gây ra (nếu có), lập biên bản bồi thường.'},
  MO_CUA:      {label: 'Mở cửa tủ trái phép', sev: 3, icon: '🚪', act: 'Xác minh có tổ nào đang làm việc tại tủ không. Nếu không có: cử người đến kiểm tra ngay.'},
  CB_TONG:     {label: 'CB tổng bị cắt / nhảy', sev: 3, icon: '🔻', act: 'Kiểm tra chạm chập trên tuyến trước khi đóng lại CB tổng.'},
  MAT_DIEN:    {label: 'Mất điện lưới', sev: 2, icon: '⚡', act: 'Liên hệ điện lực khu vực hỏi lịch cắt điện hoặc sự cố lưới.'},
  MAT_PHA:     {label: 'Mất pha', sev: 2, icon: '⚡', act: 'Kiểm tra cầu chì, đầu cốt pha bị mất, báo điện lực nếu mất từ lưới.'},
  K_KHONG_DONG:{label: 'Contactor không đóng', sev: 2, icon: '🧲', act: 'Kiểm tra cuộn hút, relay trung gian, dây điều khiển của contactor.'},
  K_KHONG_CAT: {label: 'Contactor dính, không cắt', sev: 2, icon: '🧲', act: 'Tiếp điểm contactor bị dính – thay contactor.'},
  KHONG_SANG:  {label: 'Đèn không sáng', sev: 2, icon: '🌑', act: 'Contactor đã đóng nhưng không có dòng: kiểm tra CB nhánh, cầu chì, tuyến cáp.'},
  NGHIENG:     {label: 'Tủ / trụ bị nghiêng', sev: 2, icon: '📐', act: 'Kiểm tra móng, chân đế; rào chắn nếu có nguy cơ đổ.'},
  MAT_KET_NOI: {label: 'Mất kết nối thiết bị', sev: 2, icon: '📡', act: 'Kiểm tra nguồn gateway, SIM 4G / Wi-Fi tại tủ. Tủ vẫn chạy theo lịch và gửi bù cảnh báo khi có mạng.'},
  SPD:         {label: 'Chống sét hỏng', sev: 1, icon: '🌩️', act: 'Thay module chống sét (SPD) trước mùa mưa bão.'},
  CHE_DO_TAY:  {label: 'Tủ đang ở chế độ Tay', sev: 1, icon: '✋', act: 'Công tắc tại tủ đang để Tay: app không điều khiển được. Nhắc tổ trả về Tự động sau khi làm xong.'},
  SANG_NGAY:   {label: 'Đèn sáng ngoài lịch', sev: 1, icon: '☀️', act: 'Các kênh đã cắt nhưng vẫn có dòng – kiểm tra đấu nối, contactor.'},

  LOI_DONG_HO: {label: 'Lỗi đồng hồ RS485', sev: 1, icon: '🔌', act: 'Kiểm tra dây RS485, nguồn đồng hồ, địa chỉ Modbus.'},
  CB_NHANH:    {label: 'Nhảy CB nhánh', sev: 3, icon: '🔻', act: 'Ngắn mạch / chạm đất trên tuyến (cột đổ, cáp hỏng). Không đóng lại khi chưa tìm ra nguyên nhân; cử tổ đi dọc tuyến.'},
  MAT_DIEN_TUYEN: {label: 'Tuyến không có dòng', sev: 3, icon: '✂️', act: 'Đã cấp điện nhưng cả tuyến không có dòng – nghi đứt cáp sát tủ hoặc mất cầu chì lộ ra.'},
  HONG_BONG:   {label: 'Nghi hỏng bóng', sev: 1, icon: '💡', act: 'Dòng giảm 1–2 bóng: cử tổ kiểm tra bằng mắt, không cần cắt điện tuyến.'},
  GHI_NHAN:    {label: 'Ghi nhận từ bản đồ', sev: 1, icon: '📍', act: 'Sự cố được đánh dấu thủ công trên bản đồ – kiểm tra tại vị trí đã ghim.'}
};
const ACK_MSG = {'OK': 'Đã thực hiện', 'Tu dang o che do Tay tai cho': 'Tủ đang ở chế độ Tay tại chỗ', 'Tham so sai': 'Tham số sai',
  'Lich sai': 'Lịch không hợp lệ', 'Che do sai': 'Chế độ không hợp lệ', 'Lenh khong ho tro': 'Thiết bị không hỗ trợ lệnh này', 'Sai cu phap': 'Sai cú pháp', 'CB nhanh nhay lai - con su co': 'CB nhánh nhảy lại – vẫn còn sự cố trên tuyến'};
const STATUS = {new: 'Mới', assigned: 'Đã giao', doing: 'Đang xử lý', done: 'Hoàn thành'};

/* =====================================================================
   DỮ LIỆU LIGHTING-GIS – bản đồ nền CAD (VN-2000), tủ, trụ, đèn, cáp.
   Đọc trực tiếp từ app LIGHTING-GIS (cùng tên miền phucle-gps.github.io),
   dự phòng qua raw.githubusercontent.com. Không chép dữ liệu sang CSCC.
   Toạ độ: mét, gốc (X0, Y0) VN-2000 của LIGHTING-GIS.
   ===================================================================== */
const LG = {
  SRC: ['../LIGHTING-GIS/', 'https://raw.githubusercontent.com/Phucle-GPS/LIGHTING-GIS/main/'],
  QNAME: ['Quận 1', 'Quận 3', 'Bình Thạnh', 'Phú Nhuận'], QSHORT: ['Q1', 'Q3', 'BT', 'PN'],
  QC: ['#e2632f', '#7a5cf0', '#13a37c', '#d39a0b'],          // màu quận theo LIGHTING-GIS
  ready: false, err: null, src: null,
  async fetchText(name, fresh) {
    let lastErr = null;
    for (const base of this.SRC) {
      try {
        const r = await fetch(base + name, fresh ? {cache: 'no-store'} : undefined);
        if (!r.ok) { lastErr = new Error(r.status + ' ' + name); continue; }
        const u = new Uint8Array(await r.arrayBuffer());
        this.src = base;
        if (u[0] === 0x1f && u[1] === 0x8b) {
          if (!('DecompressionStream' in window)) throw new Error('Trình duyệt chưa hỗ trợ giải nén (cần Chrome/Edge/Safari bản mới)');
          return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
        }
        return new TextDecoder().decode(u);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('Không tải được ' + name);
  },
  async fetchPack(fresh) {
    const pk = await this.fetchText('pack.gz', fresh);
    const nl = pk.indexOf('\n'), idx = JSON.parse(pk.slice(0, nl)), parts = {};
    let o = nl + 1; for (const [k, l] of idx) { parts[k] = pk.substr(o, l); o += l; }
    return parts;
  },
  // Dấu nhận biết phiên bản pack.gz (ETag / ngày sửa / kích thước) – để biết khi LIGHTING-GIS có dữ liệu mới
  async packSig() {
    try {
      const r = await fetch(this.src + 'pack.gz', {method: 'HEAD', cache: 'no-store'}); if (!r.ok) return '';
      return r.headers.get('etag') || r.headers.get('last-modified') || r.headers.get('content-length') || '';
    } catch (e) { return ''; }
  },
  async load(onStep) {
    onStep && onStep('Đang tải dữ liệu trụ, cáp, tủ từ LIGHTING-GIS…');
    const parts = await this.fetchPack();
    LGSync.loadCache();                                   // chỉnh sửa đã đồng bộ lần trước – dùng ngay, kéo bản mới sau
    this.build(parts);
    this.packSig().then(s => { this.sig = s; });
    onStep && onStep('Đang tải bản đồ nền CAD…');
    let b;
    try { b = JSON.parse(await this.fetchText('base.gz')); } catch (e) { b = JSON.parse(await this.fetchText('base.json')); }
    this.buildBase(b);
    this.ready = true; this.loadedAt = Date.now();
  },
  // ---------- Mạng điện: tủ → cây cáp → trụ → cần đèn → bộ đèn ----------
  // build(): đọc pack.gz (dữ liệu gốc). compose(): áp chỉnh sửa chung của LIGHTING-GIS (ED) lên dữ liệu gốc.
  build(parts) {
    const D = JSON.parse(parts.data), CAB = JSON.parse(parts.cab), LM = JSON.parse(parts.lamps), DIST = JSON.parse(parts.dist);
    for (const n of CAB.add || []) D.tu.push(n);
    this.D = D; this.LM = LM; this.CAB0 = CAB.c; this.X0 = D.X0; this.Y0 = D.Y0;
    // Tủ: giữ nguyên đối tượng qua các lần đồng bộ (thiết bị, SCADA tham chiếu tới)
    const used = new Map(), old = this.byT || {}; this.cabs = []; this.byT = {}; this.byId = {};
    for (let t = 0; t < D.tu.length; t++) {
      const c = CAB.c[t]; if (!c) continue;
      let id = (c[10] || '').trim();
      if (!id || used.has(id)) id = 'TU' + t;
      used.set(id, t);
      const cab = Object.assign(old[t] || {}, {t, id, name: D.tu[t], x0: c[0], y0: c[1], x: c[0], y: c[1], q: DIST.q[t] ?? 2, ward: c[6] || '', addr: c[4] || '', mgr: c[3] || '', pe: c[2] || '',
        kntt: !!c[8], comm: c[9] || '', nlamp: c[5] || 0, mix: c[14] || {}, cNoi: c[11] || 0, cNgam: c[12] || 0});
      this.cabs.push(cab); this.byT[t] = cab; this.byId[id] = cab;
      if (c[2]) this.byId[c[2]] = cab;
    }
    this.compose();
  },
  ED: {},                                   // chỉnh sửa chung theo tủ: {p, s, np, ns, cab, auto} – giống LIGHTING-GIS
  C2T: {L: 'LED', H: 'HPS', M: 'MH', T: 'TT'},
  LTN: {LED: 'LED', HPS: 'HPS (cao áp sodium)', MH: 'MH (metal halide)', TT: 'Trang trí'},
  DFW: {LED: 100, HPS: 150, MH: 150, TT: 60},
  lock(t) { const e = this.ED[t]; if (!e || e.auto) return false; return Object.keys(e.p || {}).length + Object.keys(e.s || {}).length + Object.keys(e.np || {}).length + Object.keys(e.ns || {}).length + Object.keys(e.hn || {}).length > 0 || !!e.cab; },
  kind0(p) { const l = (this.D.lt[p[6]] || '').toLowerCase(); return l.includes('điện lực') ? 0 : l.includes('trang trí') ? 2 : l.includes('không có trụ') ? 3 : 1; },
  nLamp0(name) { const m = String(name).match(/\((\d+)\s*đèn\)/i); return m ? Math.min(4, +m[1]) : 1; },
  // Danh sách bộ đèn của trụ: [{t: LED/HPS/MH/TT, w: 'LED 100W…', W: số W, arm: 'Cần đơn D60', rel: góc lệch (độ) hoặc null}]
  lampsOf(d, e, kind, name) {
    const LM = this.LM, C2T = this.C2T;
    let L;
    if (e && Array.isArray(e.lts) && !e.lt) L = e.lts.slice();
    else if (e && e.lt) L = e.lt === 'NONE' ? [] : Array(Math.max(1, e.nl || (d && d[0].length) || this.nLamp0(name))).fill(e.lt);
    else if (d) { let c = [...d[0]].map(x => C2T[x] || null); const kn = c.find(x => x); c = c.map(x => x || kn || 'LED'); if (e && e.nl) { while (c.length < e.nl) c.push(c[c.length - 1] || 'LED'); c = c.slice(0, e.nl); } L = c; }
    else if (kind === 4 || kind === 5) L = [];
    else L = Array((e && e.nl) || this.nLamp0(name)).fill(kind === 2 ? 'TT' : 'LED');
    const la = (e && e.la) || {};
    return L.map((t, k) => {
      const same = d && C2T[d[0][k]] === t, ws = same ? (LM.W[(d[1] || [])[k]] || '') : '', m = /(\d+)\s*W/i.exec(ws);
      return {t, w: ws || `${t} ~${this.DFW[t] || 100}W`, W: m ? +m[1] : (this.DFW[t] || 100), arm: d && k < (d[2] || []).length ? (LM.A[d[2][k]] || '') : '', rel: la[k] ?? null};
    });
  },
  compose() {
    const D = this.D, LM = this.LM, ED = this.ED, X0 = this.X0, Y0 = this.Y0;
    const P = [], PXa = [], PYa = [], PAa = [], LAMPS = [], NEWa = [], PKa = [], base2i = new Int32Array(D.p.length).fill(-1), idIdx = new Map();
    const pe = (t, id, nw) => { const e = ED[t]; return e ? (nw ? (e.np || {})[id] : (e.p || {})[id]) : null; };
    // Trụ gốc (bỏ trụ đã xoá) – vị trí: chỉnh sửa > dời sát mép đường (snap) > gốc
    for (let b = 0; b < D.p.length; b++) {
      const p0 = D.p[b], t = p0[1], e = pe(t, p0[9], false);
      if (e && e.del) continue;
      const lk = this.lock(t), sn = p0[14];
      let x = p0[3], y = p0[4], moved = false;
      if (e && e.x != null) { x = e.x - X0; y = e.y - Y0; moved = true; } else if (sn && !lk) { x += sn[0]; y += sn[1]; }
      const p = p0.slice(); if (e && e.name) p[0] = e.name; if (moved) { p[11] = ''; p[12] = ''; }
      const kind = e && e.k != null ? e.k : this.kind0(p0);
      const i = P.length; base2i[b] = i; idIdx.set(p0[9], i);
      P.push(p); PXa.push(x); PYa.push(y); NEWa.push(0); PKa.push(kind);
      PAa.push(e && e.a != null ? e.a : (p0[18] != null && !lk ? p0[18] : p0[13]));
      LAMPS.push(this.lampsOf(LM.p[b] || null, e, kind, p0[0]));
    }
    // Trụ vẽ thêm trên LIGHTING-GIS
    for (const t in ED) for (const id in ED[t].np || {}) {
      const n = ED[t].np[id]; if (!this.byT[t] || n.del) continue;
      const kind = n.k ?? 1, i = P.length; idIdx.set(id, i);
      P.push([n.name || id, +t, -1, n.x - X0, n.y - Y0, 0, -1, -1, -1, id, '', '', '', n.a ?? 90, 0, n.w ?? 0, '', 'Vẽ thêm trên LIGHTING-GIS']);
      PXa.push(n.x - X0); PYa.push(n.y - Y0); PAa.push(n.a ?? 90); NEWa.push(1); PKa.push(kind);
      LAMPS.push(this.lampsOf(null, n, kind, n.name || ''));
    }
    const n = P.length; this.n = n; this.P = P; this.idIdx = idIdx; this.LAMPS = LAMPS;
    this.PID = P.map(p => p[9]); this.PNEW = Uint8Array.from(NEWa); this.PK = Uint8Array.from(PKa);
    this.PX = Float32Array.from(PXa); this.PY = Float32Array.from(PYa); this.PA = Float32Array.from(PAa);
    this.PT = new Int32Array(n); this.PI = new Float32Array(n); this.PL = new Uint8Array(n); this.PN = []; this.PLT = [];
    for (let i = 0; i < n; i++) {
      this.PT[i] = P[i][1]; this.PN[i] = P[i][0];
      const L = LAMPS[i]; let I = 0;
      for (const l of L) { const led = l.t === 'LED'; I += l.W * (led ? 1 : 1.12) / (230 * (led ? 0.95 : 0.9)); }   // bóng phóng điện có tổn hao chấn lưu
      this.PI[i] = I; this.PL[i] = L.length; this.PLT[i] = L.length ? L.map(l => l.w) : ['Không có đèn'];
    }
    // Cáp: gốc (trừ đoạn xoá / đổi loại) + cáp vẽ thêm
    const SA = [], SB = [], ST = [], SL = [];
    for (const s of D.s) {
      const a = base2i[s[0]], b = base2i[s[1]]; if (a < 0 || b < 0) continue;
      const t = D.p[s[0]][1], key = D.p[s[0]][9] + '>' + D.p[s[1]][9], o = ED[t] && (ED[t].s || {})[key];
      if (o && o.del) continue;
      SA.push(a); SB.push(b); ST.push(o && o.t != null ? o.t : s[2]);
      const ed = (ED[t] && ((ED[t].p || {})[D.p[s[0]][9]] || (ED[t].p || {})[D.p[s[1]][9]])) || (s[3] == null);
      SL.push(ed ? Math.hypot(PXa[b] - PXa[a], PYa[b] - PYa[a]) : s[3]);
    }
    for (const t in ED) for (const key in ED[t].ns || {}) {
      const q = ED[t].ns[key], a = idIdx.get(q.a), b = idIdx.get(q.b); if (a == null || b == null || q.del) continue;

  const lat = phi1 - (N1 * Math.tan(phi1) / R1) * (D * D / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D ** 4 / 24);

const Clock = {
  ms: (() => { const d = new Date(); d.setHours(18, 40, 0, 0); return d.getTime(); })(),
  speed: 60,
  min() { const d = new Date(this.ms); return d.getHours() * 60 + d.getMinutes(); },
  jump(hms) { const [h, m, s] = hms.split(':').map(Number); const d = new Date(this.ms); d.setHours(h, m, s, 0); this.ms = d.getTime(); }
};

/* =====================================================================
   4. TỦ GIẢ LẬP (Demo) theo mạng thật của LIGHTING-GIS.
      Mô phỏng điện qua cây cáp tới từng trụ, công suất đèn từng trụ.
      Nhận lệnh, gửi bản tin đúng định dạng firmware tu_chieu_sang.ino.
      Toàn bộ đèn của tủ coi là kênh K1 (cả đêm) – LIGHTING-GIS chưa có
      dữ liệu chia kênh K1/K2.
   ===================================================================== */
class GisDevice {
  constructor(cab) {
    this.cab = cab; this.id = cab.id;
    this.f = {mains: false, cbTrip: false, door: false, spdFail: false, local: false, offline: false, meter: false,
              kfail: [false, false, false, false], kstuck: [false, false, false, false]};
    this.cuts = new Set(); this.fails = new Set(); this.down = null;
    this.sched = DEF_SCHED.map(s => s.slice());
    this.mode = 'auto'; this.maint = false;
    this.doState = [0, 1, 2, 3].map(c => this.schedOn(c));
    this.remoteDo = this.doState.slice();
    this.di = [0, 1, 0, 0, 1, 1];
    this.tick = Math.floor(Math.random() * CFG.GIS_TELE_EVERY);
    this.changedTick = -1000; this.burst = 0;
    this.ph = [0, 1, 2].map(() => ({v: 0, i: 0, p: 0, pf: 0, ok: true}));
    this.freq = 50; this.wh = rnd(2000, 9000) * 1000;
    this.tilt = rnd(0.2, 1.2); this.vib = 0; this.lastCollision = -1e9;
    this.meterFail = 0; this.alarms = {}; this.queue = []; this.offTicks = 0; this.lwtSent = false;
    this.lit = null;
  }
  topic(leaf) { return `${App.root()}/tu/${this.id}/${leaf}`; }
  out(leaf, obj) {
    if (this.f.offline) { if (leaf === 'alarm') this.queue.push(obj); return; }
    Bus.fromDevice(this.topic(leaf), typeof obj === 'string' ? obj : JSON.stringify(obj), 'sim');
  }
  schedOn(c) { const s = this.sched[c]; return !!s[0] && inWindow(Clock.min(), s[1], s[2]); }
  closed(c) { return FB_OF_DO[c] >= 0 ? !!this.di[FB_OF_DO[c]] : (this.doState[c] || this.f.kstuck[c]) && !this.f.kfail[c]; }
  applyOutputs() {
    let changed = false;
    for (let c = 0; c < N_DO; c++) {
      const want = this.mode === 'auto' ? this.schedOn(c) : this.remoteDo[c];
      if (want !== this.doState[c]) { this.doState[c] = want; changed = true; }
    }
    if (changed) { this.changedTick = this.tick; this.burst = 2; }
  }
  readInputs() {
    const f = this.f;
    this.di[DI.DOOR] = f.door ? 1 : 0;
    this.di[DI.CB] = f.cbTrip ? 0 : 1;
    this.di[DI.SPD] = f.spdFail ? 0 : 1;
    this.di[DI.AUTO] = f.local ? 0 : 1;
    for (let c = 0; c < 2; c++) this.di[FB_OF_DO[c]] = ((this.doState[c] || f.kstuck[c]) && !f.kfail[c]) ? 1 : 0;
  }
  // Điện đi theo cây cáp: đoạn bị cắt làm tắt cả nhánh phía sau; trụ đổ chạm đất làm nhảy CB tổng
  physics() {
    const f = this.f, cab = this.cab, order = cab.order || [];
    if (this.down !== null && !f.mains && this.di[DI.CB] && this.closed(0)) { f.cbTrip = true; this.readInputs(); }
    const powered = !f.mains && this.di[DI.CB], on = powered && this.closed(0);
    const I = [0, 0, 0], dead = this.dead || (this.dead = new Uint8Array(LG.n));
    let k = 0;
    for (const i of order) {
      const p = LG.PP[i];
      dead[i] = (p >= 0 && dead[p]) || this.cuts.has(i) || this.down === i ? 1 : 0;
      if (on && !dead[i] && !this.fails.has(i)) I[k % 3] += LG.PI[i] * (1 + rnd(-0.015, 0.015));
      k++;
    }
    for (let q = 0; q < 3; q++) {
      const p = this.ph[q];
      if (f.meter) { p.ok = false; continue; }
      p.ok = true;
      p.v = powered ? 225 + rnd(-2, 2) : rnd(0, 2);
      p.i = I[q] + (powered ? rnd(0, 0.02) : 0);
      p.pf = p.i > 0.1 ? 0.95 + rnd(-0.01, 0.01) : 0;
      p.p = p.v * p.i * p.pf;
      this.wh += p.p * Clock.speed / 3600;
    }
    this.freq = powered ? 50 + rnd(-0.05, 0.05) : 0;
    this.meterFail = f.meter ? this.meterFail + 1 : 0;
    this.on = on;
  }
  // Trạng thái thật từng trụ (chỉ dùng cho Demo – tủ thật không biết điều này)
  poleLit(i) { return this.on && !(this.dead && this.dead[i]) && !this.fails.has(i); }
  send(code, phase, on, msg, extra) {
    this.out('alarm', Object.assign({id: this.id, code, phase, state: on ? 'on' : 'off', ts: Math.floor(Clock.ms / 1000), msg,
      v: this.ph.map(p => +p.v.toFixed(1)), i: this.ph.map(p => +p.i.toFixed(2))}, extra || {}));
  }
  ev(key, code, phase, cond, need, msgOn, msgOff) {
    const a = this.alarms[key] || (this.alarms[key] = {cnt: 0, active: false});
    if (cond) { a.cnt++; if (!a.active && a.cnt >= need) { a.active = true; this.send(code, phase, true, msgOn); } }
    else { a.cnt = 0; if (a.active) { a.active = false; this.send(code, phase, false, msgOff); } }
  }
  analyze() {
    const ph = this.ph, di = this.di, settled = this.tick - this.changedTick > CFG.GRACE_TICKS;
    const localManual = !di[DI.AUTO], anyOn = this.doState.some(Boolean);
    this.ev('CB_TONG', 'CB_TONG', '-', !di[DI.CB], 2, this.down !== null ? 'CB tổng nhảy – nghi ngắn mạch trên tuyến (trụ đổ / cáp chạm đất)' : 'CB tổng bị cắt/nhảy', 'CB tổng đã đóng');
    const allLost = ph.filter(p => p.ok && p.v < CFG.V_LOST).length === 3;
    this.ev('MAT_DIEN', 'MAT_DIEN', '-', allLost && di[DI.CB], CFG.DEBOUNCE_N, 'Mất điện lưới cả 3 pha', 'Đã có điện lại');
    const allVOk = ph.every(p => p.ok && p.v >= CFG.V_MIN_OK);
    for (let c = 0; c < 2; c++) {
      const fb = di[FB_OF_DO[c]];
      this.ev('KD' + c, 'K_KHONG_DONG', String(c + 1), !localManual && allVOk && this.doState[c] && !fb, CFG.FB_DEBOUNCE_N, 'Đã ra lệnh đóng nhưng contactor không đóng', 'Contactor đã đóng');
      this.ev('KC' + c, 'K_KHONG_CAT', String(c + 1), !localManual && !this.doState[c] && fb, CFG.FB_DEBOUNCE_N, 'Đã ra lệnh cắt nhưng contactor vẫn đóng', 'Contactor đã cắt');
    }
    const iSum = ph.reduce((s, p) => s + (p.ok ? p.i : 0), 0);
    this.ev('SANG_NGAY', 'SANG_NGAY', '-', !anyOn && !localManual && settled && iSum >= CFG.I_LOADED, CFG.DEBOUNCE_N, 'Tất cả kênh đã cắt nhưng vẫn có dòng', 'Đèn đã tắt');
    this.ev('SPD', 'SPD', '-', !di[DI.SPD], 2, 'Thiết bị chống sét hỏng', 'Chống sét bình thường');
    this.ev('CHE_DO_TAY', 'CHE_DO_TAY', '-', localManual, 2, 'Tủ đang ở chế độ Tay tại chỗ', 'Tủ đã về Tự động');
    this.ev('MO_CUA', 'MO_CUA', '-', di[DI.DOOR] && !this.maint, 2, 'Cửa tủ bị mở ngoài giờ bảo trì', 'Cửa tủ đã đóng');
    this.ev('LOI_DONG_HO', 'LOI_DONG_HO', '-', this.meterFail >= 5, 1, 'Không đọc được đồng hồ RS485', 'Đồng hồ đã phản hồi');
    if (this.vib > CFG.VIB_ALARM_G && this.tick - this.lastCollision > CFG.COLLISION_COOLDOWN_TICKS) {
      this.lastCollision = this.tick;
      this.send('VA_CHAM', '-', true, `Rung động mạnh ${this.vib.toFixed(2)}g – nghi xe va chạm tủ`);
    }
    this.vib = 0;
    this.ev('NGHIENG', 'NGHIENG', '-', this.tilt > CFG.TILT_ALARM, CFG.DEBOUNCE_N, 'Tủ bị nghiêng', 'Đã hết nghiêng');
  }
  telemetry() {
    const ph = this.ph, ok = p => p.ok;
    this.out('telemetry', {id: this.id, ts: Math.floor(Clock.ms / 1000), f: +this.freq.toFixed(2), kwh: +(this.wh / 1000).toFixed(2),
      mode: this.mode, maint: this.maint ? 1 : 0, tilt: +this.tilt.toFixed(1), rssi: Math.round(rnd(-78, -55)), q: this.queue.length, sd: 1,
      v: ph.map(p => ok(p) ? +p.v.toFixed(1) : null), i: ph.map(p => ok(p) ? +p.i.toFixed(2) : null),
      p: ph.map(p => ok(p) ? +p.p.toFixed(1) : null), pf: ph.map(p => ok(p) ? +p.pf.toFixed(2) : null),
      di: this.di.slice(), do: this.doState.map(Number), sch: this.sched.map(s => s.slice())});
  }
  step() {
    this.tick++;
    this.readInputs(); this.applyOutputs(); this.readInputs(); this.physics(); this.analyze();
    if (this.f.offline) {
      if (++this.offTicks === CFG.LWT_AFTER && !this.lwtSent) { this.lwtSent = true; Bus.fromDevice(this.topic('status'), 'offline', 'sim'); }
    } else if (this.burst > 0) { this.burst--; this.telemetry(); }
    else if (this.tick % CFG.GIS_TELE_EVERY === 0) this.telemetry();
  }
  setOffline(on) {
    this.f.offline = on;
    if (!on) {
      this.offTicks = 0; this.lwtSent = false;
      Bus.fromDevice(this.topic('status'), 'online', 'sim');
      const q = this.queue; this.queue = [];
      q.forEach(m => this.out('alarm', m));

    }
  }
  // Lệnh giống firmware: "<ref> <lệnh> <tham số>"; thêm "cb 1" (CB tổng có motor đóng lại từ xa)
  onCmd(text) {
    if (this.f.offline) return;
    const m = text.trim().split(/\s+/), ref = +m[0], cmd = m[1], a = m.slice(2);
    let ok = true, msg = 'OK';
    const remoteCmd = ['do', 'all', 'mode'].includes(cmd);
    if (remoteCmd && !this.di[DI.AUTO]) { ok = false; msg = 'Tu dang o che do Tay tai cho'; }
    else if (cmd === 'do' || cmd === 'all') {
      const all = cmd === 'all', ch = all ? 0 : +a[0], val = +(all ? a[0] : a[1]);
      if ((!all && !(ch >= 1 && ch <= N_DO)) || Number.isNaN(val)) { ok = false; msg = 'Tham so sai'; }
      else {
        if (this.mode === 'auto') this.remoteDo = this.doState.slice();

      }

      else if (a[0] === 'remote') { this.remoteDo = this.doState.slice(); this.mode = 'remote'; }
      else { ok = false; msg = 'Che do sai'; }

      const t = /^\d{1,2}:\d{2}$/, ch = +a[0], en = +a[1];
      const on = t.test(a[2] || '') ? toMin(a[2]) : NaN, off = t.test(a[3] || '') ? toMin(a[3]) : NaN;
      if (ch >= 1 && ch <= N_DO && on >= 0 && on < 1440 && off >= 0 && off < 1440) this.sched[ch - 1] = [en ? 1 : 0, on, off];
      else { ok = false; msg = 'Lich sai'; }
    } else if (cmd === 'cb') {
      this.f.cbTrip = false; this.readInputs(); this.physics();
      if (this.f.cbTrip) { ok = false; msg = 'CB tong nhay lai - con su co'; }
    }
    else if (cmd === 'maint') this.maint = +a[0] !== 0;
    else if (cmd === 'status') { /* chỉ gửi lại số liệu */ }
    else if (cmd === 'sim') applySimFault(this, a[0], +a[1]);
    else { ok = false; msg = 'Lenh khong ho tro'; }
    this.readInputs(); this.applyOutputs(); this.readInputs(); this.physics();
    this.out('ack', {id: this.id, ref, ok: ok ? 1 : 0, msg});
    this.telemetry();
  }
}

/* ---------- Phân tích phía phần mềm: dòng đo được so với danh mục đèn LIGHTING-GIS ----------
   Dùng cho cả tủ Demo và tủ thật (chỉ cần dòng tổng 3 pha của tủ). */
const Analyzer = {
  st: {},
  run(cab) {
    const g = cab.cfg.gis !== undefined ? LG.byT[cab.cfg.gis] : null, t = cab.tele;
    if (!g || !g.exp || !t) return;
    const s = this.st[cab.cfg.key] || (this.st[cab.cfg.key] = {calib: 1, cnt: {}, lastDo: null, since: 0});
    const di = t.di || [], v = t.v || [], iSum = (t.i || []).reduce((a, b) => a + (b || 0), 0);
    const closed = FB_OF_DO[0] >= 0 ? di[FB_OF_DO[0]] === 1 : (t.do || [])[0] === 1;
    const vok = v.length && v.every(x => x !== null && x >= CFG.V_MIN_OK);
    const doKey = (t.do || []).join('');
    if (doKey !== s.lastDo) { s.lastDo = doKey; s.since = Date.now(); }
    const settled = Date.now() - s.since > 1500;
    const exp = g.exp * s.calib, lost = exp - iSum, lamps = lost / g.avgI;
    let code = null, msg = '', cand = [];
    if (closed && vok && di[DI.CB] !== 0 && settled) {
      if (iSum < 0.1 * exp) { code = 'KHONG_SANG'; cand = [g.root]; msg = `Đã đóng K1 nhưng dòng ≈ 0 (chuẩn ${exp.toFixed(1)} A) – nghi đứt cáp đầu tuyến hoặc mất CB nhánh`; }
      else if (lamps >= 2.5 && lost >= 0.06 * exp) {
        code = 'CAT_CAP'; cand = LG.locate(g, lost / s.calib);
        msg = `Dòng giảm ${lost.toFixed(1)} A (≈ ${Math.round(lamps)} bóng) – ${cand.length ? 'nghi đứt cáp ' + LG.where(cand[0]) : 'chưa khớp được đoạn cáp nào, cần kiểm tra'}`;
      } else if (lamps >= 0.6) { code = 'HONG_BONG'; msg = `Dòng giảm ${lost.toFixed(1)} A (≈ ${Math.max(1, Math.round(lamps))} bóng) – nghi hỏng bóng lẻ`; }
      else if (Math.abs(iSum / g.exp - 1) < 0.15) s.calib = 0.95 * s.calib + 0.05 * (iSum / g.exp);   // tự hiệu chỉnh theo dòng thực tế
    }
    for (const c of ['KHONG_SANG', 'CAT_CAP', 'HONG_BONG']) {
      const on = c === code;
      s.cnt[c] = on ? (s.cnt[c] || 0) + 1 : 0;
      const active = !!cab.active[c];
      if (on && s.cnt[c] >= 2 && (!active || JSON.stringify(cab.active[c].cand) !== JSON.stringify(cand))) App.onAlarm(cab, {code: c, phase: '-', state: 'on', msg, cand, lost: +lost.toFixed(2), ts: t.ts || 0});
      if (!on && active) App.onAlarm(cab, {code: c, phase: '-', state: 'off', msg: 'Dòng đã trở lại bình thường', ts: t.ts || 0});
    }
  }
};

/* =====================================================================
   5. BUS – thay cho broker MQTT khi chạy demo; ghi bản tin ra console
   ===================================================================== */
const Bus = {
  lines: [], dirty: false,
  fromDevice(topic, text, source) { this.log(topic, text); App.onMessage(topic, text, source); },
  log(topic, text) {
    const leaf = topic.split('/').pop();
    const cls = {alarm: 'a', status: 's', cmd: 'c', ack: 's'}[leaf] || '';
    this.lines.push(`<span class="t">${esc(fmtClock(Date.now()))} ${esc(topic)}</span> <span class="${cls}">${esc(text)}</span>`);
    if (this.lines.length > 200) this.lines.shift();
    this.dirty = true;
  },
  flush() {
    const c = $('#console'); if (!c || !this.dirty) return; this.dirty = false;
    const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 30;
    c.innerHTML = this.lines.join('\n');
    if (atBottom) c.scrollTop = c.scrollHeight;
  }
};

  saveEnergy() { store.set('gst3.energy', this.energy); },

  // Khởi tạo sau khi tải xong LIGHTING-GIS: mỗi tủ GIS có một tủ Demo; tủ thật (MQTT) tự gắn theo mã
  init() {
    const saved = Array.isArray(this.cabCfg) ? this.cabCfg.filter(c => c.source !== 'sim') : [];
    const teams = this.settings.teams;
    saved.forEach(c => { const g = LG.byId[c.id]; if (g) c.gis = g.t; });
    const sims = LG.cabs.map(g => ({key: 'sim:' + g.id, id: g.id, source: 'sim', gis: g.t, name: g.name, area: `${LG.QNAME[g.q]}${g.ward ? ' · ' + g.ward : ''}`,
      team: teams[g.q] || teams[0], doNames: DEF_DO.slice(), diNames: DEF_DI.slice()}));
    this.cabCfg = saved.concat(sims);
    this.cabCfg.forEach(cfg => { if (this.cabs[cfg.key]) { this.cabs[cfg.key].cfg = cfg; this.indexGis(cfg); } else this.addRuntime(cfg); });
    Object.values(this.cabs).forEach(c => { if (c.cfg.gis === undefined && LG.byId[c.cfg.id]) { c.cfg.gis = LG.byId[c.cfg.id].t; this.indexGis(c.cfg); } });
    LG.cabs.forEach(g => { this.devices[g.id] = new GisDevice(g); });
    if (!LG.byId[this.simCab]) this.simCab = (LG.cabs.find(g => g.poles.length > 20) || LG.cabs[0]).id;
    if (this.settings.demo) Object.values(this.devices).forEach(d => { d.readInputs(); d.physics(); d.telemetry(); });
    this.inited = true;
  },
  indexGis(cfg) { if (cfg.gis === undefined) return; const a = this.byGis[cfg.gis] || (this.byGis[cfg.gis] = []); if (!a.includes(cfg.key)) a.push(cfg.key); },
  addRuntime(cfg) {
    this.cabs[cfg.key] = {cfg, tele: null, online: true, lastSeen: Date.now(), hist: [], active: {}, log: []};
    this.indexGis(cfg);
    return this.cabs[cfg.key];
  },
  visibleCabs() { return Object.values(this.cabs).filter(c => c.cfg.source !== 'sim' || this.settings.demo); },
  ensureCab(source, id) {
    const key = source + ':' + id;
    if (this.cabs[key]) return this.cabs[key];
    const g = LG.ready ? LG.byId[id] : null;
    const cfg = {key, id, source, gis: g ? g.t : undefined, name: g ? g.name : 'Tủ ' + id, area: g ? `${LG.QNAME[g.q]}${g.ward ? ' · ' + g.ward : ''}` : 'Chưa gắn GIS',
      team: g ? (this.settings.teams[g.q] || this.settings.teams[0]) : this.settings.teams[0] || 'Tổ 1', doNames: DEF_DO.slice(), diNames: DEF_DI.slice()};
    this.cabCfg.push(cfg); this.saveCabs();
    return this.addRuntime(cfg);
  },
  nowFor(cab) { return cab && cab.cfg.source === 'sim' ? Clock.ms : Date.now(); },
  addLog(cab, s, t) { cab.log.unshift({t: t || this.nowFor(cab), s}); if (cab.log.length > 200) cab.log.pop(); },

  /* ---------- Bản tin từ thiết bị ---------- */
  onMessage(topic, text, source) {
    const parts = topic.split('/'); if (parts.length < 3) return;
    const leaf = parts.pop(), id = parts.pop();
    if (source === 'sim' && !this.settings.demo) return;
    const cab = this.ensureCab(source, id);
    if (leaf === 'status') { if (text === 'offline') this.markOffline(cab, 'Broker báo thiết bị mất kết nối'); else this.markOnline(cab); return; }
    if (leaf === 'cmd') { if (!this.pending[text.split(' ')[0]]) this.addLog(cab, `Lệnh từ thiết bị khác: ${text}`); return; }
    let m; try { m = JSON.parse(text); } catch (e) { return; }
    cab.lastSeen = Date.now();
    if (!cab.online) this.markOnline(cab);
    if (leaf === 'telemetry') this.onTelemetry(cab, m);
    else if (leaf === 'alarm') this.onAlarm(cab, m);
    else if (leaf === 'ack') this.onAck(cab, m);
  },
  onTelemetry(cab, m) {
    cab.tele = m;
    const t = m.ts ? m.ts * 1000 : this.nowFor(cab);
    cab.hist.push({t, v: m.v || [], i: m.i || [], p: (m.p || []).reduce((s, x) => s + (x || 0), 0)});
    if (cab.hist.length > CFG.HIST) cab.hist.shift();
    if (typeof m.kwh === 'number') {
      const e = this.energy[cab.cfg.key] || (this.energy[cab.cfg.key] = {});
      const d = dayKey(t);
      if (!e[d]) e[d] = [m.kwh, m.kwh]; else e[d][1] = m.kwh;
      this.energyDirty = true;
    }
    if (LG.ready) Analyzer.run(cab);
  },
  markOffline(cab, why) { if (!cab.online) return; cab.online = false; this.onAlarm(cab, {code: 'MAT_KET_NOI', phase: '-', state: 'on', msg: why, ts: 0}); },
  markOnline(cab) { if (cab.online) return; cab.online = true; cab.lastSeen = Date.now(); this.onAlarm(cab, {code: 'MAT_KET_NOI', phase: '-', state: 'off', msg: 'Thiết bị kết nối lại', ts: 0}); },

  onAlarm(cab, m) {
    const info = ALARM[m.code]; if (!info) return;
    const at = m.ts ? m.ts * 1000 : this.nowFor(cab);
    const phase = m.phase && m.phase !== '-' ? m.phase : null;
    const akey = m.code + (phase || '');
    if (m.state === 'on') cab.active[akey] = m.code === 'VA_CHAM' ? {...m, exp: Date.now() + 60000} : m;
    else delete cab.active[akey];
    this.addLog(cab, `${m.state === 'on' ? '⚠️' : '✅'} ${info.label}${phase ? ' ' + phaseLabel(m.code, phase) : ''}: ${m.msg}`, at);
    let inc = this.incidents.find(x => x.cab === cab.cfg.key && x.code === m.code && x.status !== 'done');
    const iTxt = m.i && /^[ABC]$/.test(phase || '') ? ` (I=${m.i['ABC'.indexOf(phase)]} A, U=${m.v['ABC'.indexOf(phase)]} V)` : '';
    if (m.state === 'on' && m.cand) { if (inc) { inc.cand = m.cand; inc.lost = m.lost; } }   // vị trí nghi đứt theo GIS
    if (m.state === 'on' && m.est !== undefined && phase) {           // vị trí ước tính theo tuyến
      cab.active[akey].est = m.est;
      if (inc) { inc.est = inc.est || {}; inc.est[phase] = m.est; }
    }
    if (m.state === 'on') {
      if (inc) {
        inc.count++; inc.cleared = false;
        if (phase && !inc.phases.includes(phase)) inc.phases.push(phase);
        if (phase && !inc.activePh.includes(phase)) inc.activePh.push(phase);
        inc.log.push({t: at, s: `Thiết bị báo lại${phase ? ' ' + phaseLabel(m.code, phase) : ''}${iTxt}`});
      } else {
        inc = {no: 'SC-' + String(++this.seq).padStart(4, '0'), cab: cab.cfg.key, tu: cab.cfg.id, name: cab.cfg.name, area: cab.cfg.area,
          code: m.code, phases: phase ? [phase] : [], activePh: phase ? [phase] : [], at, status: 'new', team: cab.cfg.team,
          note: '', count: 1, cleared: false, est: m.est !== undefined && phase ? {[phase]: m.est} : undefined, cand: m.cand, lost: m.lost, log: [{t: at, s: `Phát hiện: ${m.msg}${iTxt}`}]};
        this.incidents.push(inc);
        toast(`${info.icon} ${cab.cfg.id}: ${info.label}${phase ? ' – ' + phaseLabel(m.code, phase) : ''}`);
        if (info.sev >= 3) this.alert();
      }
    } else if (inc) {
      if (phase) inc.activePh = inc.activePh.filter(p => p !== phase);
      if (!phase || !inc.activePh.length) { inc.cleared = true; inc.log.push({t: at, s: `Thiết bị báo đã hết: ${m.msg}`}); }
    }
    this.saveInc(); this.incDirty = true;
  },
  onAck(cab, m) {
    const p = this.pending[m.ref]; if (!p || p.key !== cab.cfg.key) return;
    clearTimeout(p.timer); delete this.pending[m.ref];
    const msg = ACK_MSG[m.msg] || m.msg;
    this.addLog(cab, `${m.ok ? '✔' : '✖'} ${p.label} – ${msg}`);
    p.resolve({ok: !!m.ok, msg});
  },
  alert() {
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    if (!this.sound || !this.ac) return;
    try { const o = this.ac.createOscillator(), g = this.ac.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(this.ac.destination); o.start(); o.stop(this.ac.currentTime + 0.35); } catch (e) {}
  },

  /* ---------- Gửi lệnh: chờ tủ xác nhận (ack) hoặc hết giờ ---------- */
  send(cab, body, label) {
    const ref = String(Date.now() % 1e9 + Math.floor(Math.random() * 1000));
    const text = `${ref} ${body}`, topic = `${this.root()}/tu/${cab.cfg.id}/cmd`;
    return new Promise(resolve => {
      if (cab.cfg.source === 'mqtt' && !(this.mq && this.mq.connected)) { resolve({ok: false, msg: 'App chưa kết nối broker'}); return; }
      this.pending[ref] = {key: cab.cfg.key, label, resolve, timer: setTimeout(() => {
        delete this.pending[ref];
        this.addLog(cab, `✖ ${label} – tủ không phản hồi`);
        resolve({ok: false, msg: 'Tủ không phản hồi (mất kết nối?)'});
      }, CFG.CMD_TIMEOUT_MS)};
      this.addLog(cab, `➜ Gửi lệnh: ${label}`);
      Bus.log(topic, text);
      if (cab.cfg.source === 'sim') setTimeout(() => this.devices[cab.cfg.id].onCmd(text), 250 + Math.random() * 300);
      else this.mq.publish(topic, text, {qos: 1});
    });
  },
  pendingFor(key, match) { return Object.values(this.pending).some(p => p.key === key && (!match || p.label.includes(match))); },

  cabState(cab) {
    if (!cab.online) return 'off';
    const sev = Object.values(cab.active).map(a => ALARM[a.code]?.sev || 1);
    if (!sev.length) return 'ok';
    return Math.max(...sev) >= 3 ? 'bad' : 'warn';
  }
};

function phaseLabel(code, ph) { return /^R\d+$/.test(ph) ? 'tuyến ' + ph : code.startsWith('K_') ? 'K' + ph : 'pha ' + ph; }
function modeInfo(t) {
  if (!t) return {txt: 'Chưa có dữ liệu', cls: ''};
  if (t.di && t.di[DI.AUTO] === 0) return {txt: '✋ Tay tại chỗ', cls: 'warn'};
  return t.mode === 'remote' ? {txt: '📱 Điều khiển từ xa', cls: 'acc'} : {txt: '🕒 Tự động theo lịch', cls: 'ok'};
}
function seedEnergy(e, kwhNow, cab, t) {            // dữ liệu mẫu 30 ngày trước cho tủ demo
  const g = cab.cfg.gis !== undefined ? LG.byT[cab.cfg.gis] : null;
  const daily = g ? g.exp * 0.225 * 0.95 * 11.5 : 20;
  const hrs = new Date(t).getHours() + new Date(t).getMinutes() / 60;
  // phần đã dùng từ 0h: rạng sáng (đến 5:30) ~ 45% điện năng ngày, tối (từ 18:00) phần còn lại
  const usedToday = daily * (Math.min(hrs, 5.5) / 5.5 * 0.45 + (hrs >= 18 ? (hrs - 18) / 6 * 0.55 : 0));
  e[dayKey(t)] = [+(kwhNow - usedToday).toFixed(2), kwhNow];
  let end = kwhNow - usedToday;
  for (let d = 1; d <= 30; d++) {
    const k = dayKey(t - d * 86400000), used = daily * rnd(0.9, 1.08);
    e[k] = [+(end - used).toFixed(2), +end.toFixed(2)]; end -= used;
  }
}
function energyStats(key, nowMs) {
  const e = App.energy[key] || {}, today = dayKey(nowMs), month = today.slice(0, 7);
  const used = k => e[k] ? Math.max(0, e[k][1] - e[k][0]) : 0;
  const days = [];
  for (let d = 13; d >= 0; d--) { const k = dayKey(nowMs - d * 86400000); days.push({k, v: used(k)}); }
  const monthSum = Object.keys(e).filter(k => k.startsWith(month)).reduce((s, k) => s + used(k), 0);
  const past = days.slice(0, -1).filter(d => d.v > 0);
  return {today: used(today), month: monthSum, days, avg: past.length ? past.reduce((s, d) => s + d.v, 0) / past.length : 0};
}

function openModal(html) { $('#modal').innerHTML = html; $('#modal').classList.add('on'); $('#modalBg').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); $('#modalBg').classList.remove('on'); if (closeModal.cb) { const cb = closeModal.cb; closeModal.cb = null; cb(); } }
$('#modalBg').onclick = closeModal;
function confirmAction(title, body, okLabel = 'Thực hiện') {
  const needPin = App.settings.pinHash && Date.now() > App.unlockedUntil;
  return new Promise(resolve => {
    openModal(`<h2>${esc(title)}</h2><div class="sub" style="font-size:14px">${body}</div>
      ${needPin ? '<div class="field" style="margin-top:12px"><label for="pinIn">Mã PIN điều khiển</label><input id="pinIn" class="in" type="password" inputmode="numeric" autocomplete="off"></div>' : ''}
      <div class="btns"><button class="btn" id="mNo">Huỷ</button><button class="btn pri" id="mYes">${esc(okLabel)}</button></div>`);
    closeModal.cb = () => resolve(false);
    const pinIn = $('#pinIn'); if (pinIn) pinIn.focus();
    $('#mNo').onclick = closeModal;
    $('#mYes').onclick = () => {
      if (needPin) {
        if (hash(pinIn.value) !== App.settings.pinHash) { toast('Sai mã PIN'); pinIn.value = ''; return; }
        App.unlockedUntil = Date.now() + CFG.PIN_UNLOCK_MS;
      }
      closeModal.cb = null; closeModal(); resolve(true);
    };
  });
}

const okIcon = r => r.ok ? '✔' : '✖';
async function cmdDo(key, ch, val) {
  const cab = App.cabs[key], name = cab.cfg.doNames[ch - 1];
  const t = cab.tele, note = t && t.mode === 'auto' ? '<br><br>Tủ sẽ chuyển sang <b>Điều khiển từ xa</b> và giữ nguyên theo lệnh. Bấm "Về tự động" để chạy lại theo lịch.' : '';
  if (!await confirmAction(`${val ? 'Bật' : 'Tắt'} ${name}?`, `Tủ <b>${esc(cab.cfg.id)}</b> – ${esc(cab.cfg.name)}${note}`, val ? 'Bật' : 'Tắt')) return;
  const p = App.send(cab, `do ${ch} ${val}`, `${val ? 'Bật' : 'Tắt'} ${name}`); render(true);
  const r = await p;
  toast(`${okIcon(r)} ${cab.cfg.id}: ${val ? 'Bật' : 'Tắt'} ${name} – ${r.msg}`); render(true);
}
async function cmdSimple(key, body, label, ask) {
  const cab = App.cabs[key];
  if (ask && !await confirmAction(label + '?', `Tủ <b>${esc(cab.cfg.id)}</b> – ${esc(cab.cfg.name)}`)) return;
  const r = await App.send(cab, body, label);
  toast(`${okIcon(r)} ${cab.cfg.id}: ${label} – ${r.msg}`); render(true);
}
async function cmdBulk(keys, ch, action) {
  if (!keys.length) { toast('Chưa chọn tủ nào'); return; }
  const chName = ch === 'all' ? 'tất cả kênh' : DEF_DO[ch - 1];
  const label = action === 'auto' ? 'Về tự động theo lịch' : `${action === '1' ? 'Bật' : 'Tắt'} ${chName}`;
  if (!await confirmAction(`${label} cho ${keys.length} tủ?`, keys.map(k => esc(App.cabs[k].cfg.id)).join(', '))) return;
  toast(`Đang gửi lệnh tới ${keys.length} tủ…`);
  const body = action === 'auto' ? 'mode auto' : ch === 'all' ? `all ${action}` : `do ${ch} ${action}`;
  const res = await Promise.all(keys.map(k => App.send(App.cabs[k], body, label).then(r => ({k, ...r}))));
  const fail = res.filter(r => !r.ok);
  toast(`${label}: ${res.length - fail.length}/${res.length} tủ đã thực hiện${fail.length ? ' · không được: ' + fail.map(f => App.cabs[f.k].cfg.id).join(', ') : ''}`);
  render(true);
}
function schedRows() {
  return [1, 2, 3, 4].map(ch => {
    const row = document.querySelector(`[data-sched-row="${ch}"]`);
    return {ch, en: row.querySelector('.s-en').checked ? 1 : 0, on: row.querySelector('.s-on').value, off: row.querySelector('.s-off').value};
  });
}
async function cmdSched(key, ch) {
  const cab = App.cabs[key], r0 = schedRows()[ch - 1];
  if (!r0.on || !r0.off) { toast('Nhập đủ giờ bật và giờ tắt'); return; }
  const r = await App.send(cab, `sched ${ch} ${r0.en} ${r0.on} ${r0.off}`, `Lịch ${cab.cfg.doNames[ch - 1]}: ${r0.en ? r0.on + ' → ' + r0.off : 'tắt lịch'}`);
  toast(`${okIcon(r)} ${cab.cfg.id}: lưu lịch K${ch} – ${r.msg}`);
}
async function cmdSchedAll(key) {
  const src = App.cabs[key], rows = schedRows();
  const targets = App.visibleCabs().filter(c => c.cfg.area === src.cfg.area && c.online);
  if (!await confirmAction(`Áp dụng lịch này cho ${targets.length} tủ ${src.cfg.area}?`, targets.map(c => esc(c.cfg.id)).join(', '))) return;
  toast('Đang gửi lịch…');
  let ok = 0;
  for (const c of targets) {
    const rs = await Promise.all(rows.map(r => App.send(c, `sched ${r.ch} ${r.en} ${r.on} ${r.off}`, `Lịch K${r.ch}: ${r.en ? r.on + ' → ' + r.off : 'tắt lịch'}`)));
    if (rs.every(r => r.ok)) ok++;
  }
  toast(`Đã áp dụng lịch cho ${ok}/${targets.length} tủ`);
}

/* ---------- Mục Điều khiển: danh sách tủ + điều khiển hàng loạt ---------- */
function ctlTabs(on) {
  return `<div class="row" style="margin-bottom:10px"><h1 class="grow" style="margin:0">Điều khiển tủ</h1></div>
    <div class="tabs"><a href="#/dieu-khien" class="${on === 'tu' ? 'on' : ''}">🗄️ Các tủ</a><a href="#/dieu-khien/hang-loat" class="${on === 'hang-loat' ? 'on' : ''}">🎛️ Điều khiển hàng loạt</a></div>`;
}
function ctlFiltered() {
  return App.visibleCabs().filter(c => {
    const g = c.cfg.gis !== undefined ? LG.byT[c.cfg.gis] : null;
    if (g) return cabMatches(g) && (c.cfg.source !== 'sim' || gisCab(g.t) === c);
    return Filt.q < 0 && (!Filt.text || unaccent(c.cfg.id + ' ' + c.cfg.name).includes(unaccent(Filt.text)));
  });
}
function ctlSearch(id) { return `<div class="row" style="margin:8px 0">${qChips('c-q')}<input class="in grow" id="${id}" data-act="ctl-find" placeholder="Tìm tủ theo mã, tên, địa chỉ, phường…" value="${esc(Filt.text)}" autocomplete="off" style="min-width:180px"></div>`; }
function viewHome() {
  if (!LG.ready || !App.inited) return gisLoading();
  const cabs = ctlFiltered();
  const online = cabs.filter(c => c.online && c.tele).length, lit = cabs.filter(c => (c.tele?.do || []).some(x => x)).length;
  const pkw = cabs.reduce((s2, c) => s2 + (c.tele?.p || []).reduce((a, b) => a + (b || 0), 0), 0) / 1000;
  const openInc = App.incidents.filter(x => x.status !== 'done').length;
  const order = {bad: 0, warn: 1, off: 2, ok: 3};
  cabs.sort((a, b) => order[App.cabState(a)] - order[App.cabState(b)] || a.cfg.id.localeCompare(b.cfg.id));
  const shown = cabs.slice(0, App.ctlN);
  return `${ctlTabs('tu')}${ctlSearch('ctlQ')}
    <div class="kpis">
      <div class="kpi"><span>Tủ trực tuyến</span><b>${online}<small>/ ${cabs.length}</small></b></div>
      <div class="kpi"><span>Tủ đang sáng</span><b>${lit}</b></div>
      <div class="kpi"><span>Công suất</span><b>${pkw.toFixed(1)}<small>kW</small></b></div>
      <a class="kpi" href="#/canh-bao" style="color:inherit"><span>Sự cố chưa xong</span><b style="color:${openInc ? 'var(--bad)' : 'var(--ok)'}">${openInc}</b></a>
    </div>
    <div class="grid">${shown.map(cabCard).join('') || '<div class="empty">Không có tủ khớp bộ lọc.</div>'}</div>
    ${cabs.length > shown.length ? `<div class="btns" style="justify-content:center"><button class="btn" data-act="ctl-more">Xem thêm (${cabs.length - shown.length} tủ)</button></div>` : ''}`;
}

/* ---------- Chi tiết tủ ---------- */
const TABS = [['do-luong', 'Đo lường'], ['3d', 'Sơ đồ 3D'], ['vao-ra', 'Vào / Ra'], ['dien-nang', 'Điện năng'], ['lich', 'Lịch'], ['nhat-ky', 'Nhật ký']];
function viewCab(key, tab) {
  if (!App.inited) return gisLoading();
  const cab = App.cabs[key];
  if (!cab) return '<div class="empty">Không tìm thấy tủ. <a href="#/dieu-khien">Về danh sách</a></div>';
  const body = {'do-luong': tabMeasure, '3d': tab3D, 'vao-ra': tabIO, 'dien-nang': tabEnergy, 'lich': tabSched, 'nhat-ky': tabLog}[tab](cab);
  return `<a class="back" href="#/dieu-khien">‹ Danh sách tủ</a>
    <div class="panel" id="cabHead">${cabHeadHtml(cab)}</div>
    <div class="tabs">${TABS.map(([k, n]) => `<a href="#/tu/${encodeURIComponent(key)}/${k}" class="${k === tab ? 'on' : ''}">${n}</a>`).join('')}</div>
    ${body}`;
}
function cabHeadHtml(cab) {
  const key = cab.cfg.key, t = cab.tele || {}, s = App.cabState(cab), mi = modeInfo(t);
  const ago = Math.round((Date.now() - cab.lastSeen) / 1000);
  return `<div class="row"><div class="grow"><h1 style="margin:0">${esc(cab.cfg.id)} · ${esc(cab.cfg.name)}</h1>
      <div class="sub">${esc(cab.cfg.area)} · ${esc(cab.cfg.team)} · ${cab.online ? (!cab.tele ? 'chưa có dữ liệu' : ago < 6 ? 'vừa cập nhật' : `cập nhật ${ago} giây trước`) : '<b style="color:var(--bad)">mất kết nối</b>'}</div></div></div>
      <div class="row" style="margin-top:6px">${statusPill(s)}<span class="pill ${mi.cls}">${mi.txt}</span></div>
      ${lampsHtml(cab, true)}
      ${Object.keys(cab.active).length ? `<div class="alarms">${alarmPills(cab)}</div>` : ''}
      <div class="btns">
        <button class="btn sm" data-act="mode-auto" data-key="${esc(key)}" ${t.mode === 'remote' ? '' : 'disabled'}>🕒 Về tự động</button>
        <button class="btn sm" data-act="maint" data-key="${esc(key)}" data-val="${t.maint ? 0 : 1}">🔧 ${t.maint ? 'Kết thúc bảo trì' : 'Bật bảo trì'}</button>
        <button class="btn sm" data-act="status" data-key="${esc(key)}">🔄 Đọc lại</button>
      </div>`;
}
function legend() { return `<div class="legend">${[0, 1, 2].map(k => `<span><i style="background:${PHC[k]}"></i>Pha ${'ABC'[k]}</span>`).join('')}</div>`; }
function tabMeasure(cab) {
  const t = cab.tele || {}, v = t.v || [], i = t.i || [], p = t.p || [], pf = t.pf || [];
  const ptot = p.reduce((a, b) => a + (b || 0), 0);
  const range = (arr, k) => {
    const xs = cab.hist.map(h => h[arr][k]).filter(x => x !== null && x !== undefined);
    return xs.length ? `${Math.min(...xs).toFixed(arr === 'v' ? 0 : 1)}–${Math.max(...xs).toFixed(arr === 'v' ? 0 : 1)}` : '—';
  };
  const cols = f => [0, 1, 2].map(f).join('');
  return `<div class="kpis">
      <div class="kpi"><span>Công suất tổng</span><b>${num(ptot / 1000, 2)}<small>kW</small></b></div>
      <div class="kpi"><span>Tần số</span><b>${num(t.f, 2)}<small>Hz</small></b></div>
      <div class="kpi"><span>Chỉ số điện năng</span><b>${num(t.kwh, 1)}<small>kWh</small></b></div>
      <div class="kpi"><span>Độ nghiêng tủ</span><b>${num(t.tilt, 1)}<small>°</small></b></div>
    </div>
    <div class="panel"><h2>Thông số 3 pha</h2>
      <table><thead><tr><th></th>${cols(k => `<th class="num" style="color:${PHC[k]}">Pha ${'ABC'[k]}</th>`)}</tr></thead><tbody>
      <tr><td>Điện áp (V)</td>${cols(k => `<td class="num"><b>${num(v[k], 1)}</b></td>`)}</tr>
      <tr><td>Dòng điện (A)</td>${cols(k => `<td class="num"><b>${num(i[k], 2)}</b></td>`)}</tr>
      <tr><td>Công suất (W)</td>${cols(k => `<td class="num">${num(p[k], 0)}</td>`)}</tr>
      <tr><td>Hệ số cos φ</td>${cols(k => `<td class="num">${num(pf[k], 2)}</td>`)}</tr>
      <tr><td class="sub">Dải U 10 phút</td>${cols(k => `<td class="num sub">${range('v', k)}</td>`)}</tr>
      <tr><td class="sub">Dải I 10 phút</td>${cols(k => `<td class="num sub">${range('i', k)}</td>`)}</tr>
      </tbody></table></div>
    <div class="cols">
      <div class="panel"><h2>Dòng điện (A)</h2><canvas id="chI"></canvas>${legend()}</div>
      <div class="panel"><h2>Điện áp (V)</h2><canvas id="chV"></canvas>${legend()}</div>
    </div>`;
}
function tabIO(cab) {
  const t = cab.tele || {}, d = t.do || [], di = t.di || [], sch = t.sch || DEF_SCHED, key = cab.cfg.key;
  const local = di[DI.AUTO] === 0;
  return `<div class="cols">
    <div class="panel"><h2>Đầu ra (DO) – điều khiển</h2>
      ${local ? '<div class="pill warn" style="margin-bottom:8px;white-space:normal">✋ Công tắc tại tủ đang ở Tay – lệnh từ xa sẽ bị từ chối</div>' : ''}
      ${cab.cfg.doNames.map((n, c) => {
        const on = d[c] === 1, fbIdx = FB_OF_DO[c], fb = fbIdx >= 0 ? di[fbIdx] : undefined;
        const mismatch = fb !== undefined && t.do && fb !== d[c];
        const s = sch[c] || [0, 0, 0], pend = App.pendingFor(key, n);
        return `<div class="io"><span class="led ${on ? 'lampon' : ''}"></span>
          <div class="grow"><b>DO${c + 1} · ${esc(n)}</b>
            <div class="sub">${on ? 'Đang đóng (sáng)' : 'Đang cắt'}${fb !== undefined ? ` · phản hồi: ${fb ? 'đóng' : 'mở'} ${mismatch ? '<b style="color:var(--bad)">⚠ lệch</b>' : '✔'}` : ''}
            · lịch ${s[0] ? hm(s[1]) + '→' + hm(s[2]) : 'tắt'}${pend ? ' · <b>đang gửi lệnh…</b>' : ''}</div></div>
          <button class="switch${on ? ' on' : ''}${pend ? ' pending' : ''}" role="switch" aria-checked="${on}" aria-label="${esc(n)}" data-act="do" data-key="${esc(key)}" data-ch="${c + 1}" data-val="${on ? 0 : 1}"></button></div>`;
      }).join('')}
      <div class="btns"><button class="btn sm" data-act="all" data-key="${esc(key)}" data-val="1">💡 Bật tất cả</button>
        <button class="btn sm" data-act="all" data-key="${esc(key)}" data-val="0">⚫ Tắt tất cả</button>
        <button class="btn sm" data-act="mode-auto" data-key="${esc(key)}">🕒 Về tự động</button></div>
    </div>
    <div class="panel"><h2>Đầu vào (DI) – giám sát</h2>
      ${cab.cfg.diNames.map((n, k) => {
        const val = di[k], m = DI_META[k];
        let cls = val ? 'on' : '';
        if (m.normal !== null && val !== undefined && val !== m.normal) cls = 'bad';
        return `<div class="io"><span class="led ${cls}"></span><div class="grow"><b>DI${k + 1} · ${esc(n)}</b></div>
          <span class="pill ${cls === 'bad' ? 'bad' : ''}">${val === undefined ? '—' : val ? m.on : m.off}</span></div>`;
      }).join('')}
      <div class="sub" style="margin-top:8px">Bảo trì: ${t.maint ? 'BẬT (không báo mở cửa)' : 'tắt'} · Sóng ${num(t.rssi, 0)} dBm · Hàng đợi ${t.q ?? '—'} · Thẻ SD ${t.sd ? 'OK' : '—'}</div>
    </div></div>`;
}
function tabEnergy(cab) {
  const e0 = App.energy[cab.cfg.key];
  if (cab.cfg.source === 'sim' && cab.tele && (!e0 || Object.keys(e0).length < 2)) { const e = App.energy[cab.cfg.key] = e0 || {}; seedEnergy(e, cab.tele.kwh, cab, App.nowFor(cab)); }
  const st = energyStats(cab.cfg.key, App.nowFor(cab)), t = cab.tele || {};
  return `<div class="kpis">
      <div class="kpi"><span>Chỉ số tổng</span><b>${num(t.kwh, 1)}<small>kWh</small></b></div>
      <div class="kpi"><span>Hôm nay</span><b>${st.today.toFixed(1)}<small>kWh</small></b></div>
      <div class="kpi"><span>Tháng này</span><b>${st.month.toFixed(0)}<small>kWh</small></b></div>
      <div class="kpi"><span>TB / ngày (13 ngày)</span><b>${st.avg.toFixed(1)}<small>kWh</small></b></div>
    </div>
    <div class="panel"><div class="row"><h2 class="grow">Điện năng 14 ngày</h2><button class="btn sm" data-act="energy-csv" data-key="${esc(cab.cfg.key)}">⬇️ Excel</button></div>
      <canvas id="chE"></canvas>
      ${cab.cfg.source === 'sim' ? '<div class="sub" style="margin-top:6px">Số liệu các ngày trước của tủ demo là dữ liệu mẫu.</div>' : ''}</div>
    <div class="panel"><table><thead><tr><th>Ngày</th><th class="num">kWh</th></tr></thead><tbody>
      ${st.days.slice().reverse().map(d => `<tr><td>${d.k.split('-').reverse().join('/')}</td><td class="num">${d.v.toFixed(2)}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function tabSched(cab) {
  const sch = cab.tele?.sch || DEF_SCHED, key = cab.cfg.key;
  return `<div class="panel"><h2>Lịch bật / tắt từng kênh</h2>
    <p class="sub">Lịch lưu trong bộ nhớ của tủ: mất mạng tủ vẫn bật/tắt đúng giờ. Chỉ áp dụng khi tủ ở chế độ <b>Tự động</b>. Giờ tắt nhỏ hơn giờ bật nghĩa là qua đêm.</p>
    ${cab.cfg.doNames.map((n, c) => {
      const s = sch[c] || [0, 1080, 330];
      return `<div class="io" data-sched-row="${c + 1}" style="flex-wrap:wrap">
        <label class="row grow" style="min-width:150px"><input type="checkbox" class="s-en" ${s[0] ? 'checked' : ''} style="width:18px;height:18px"> <b>${esc(n)}</b></label>
        <span class="row"><input type="time" class="in s-on" value="${hm(s[1])}" aria-label="Giờ bật ${esc(n)}"> →
        <input type="time" class="in s-off" value="${hm(s[2])}" aria-label="Giờ tắt ${esc(n)}">
        <button class="btn sm pri" data-act="sched" data-key="${esc(key)}" data-ch="${c + 1}">Lưu</button></span></div>`;
    }).join('')}
    <div class="btns"><button class="btn" data-act="sched-all" data-key="${esc(key)}">📋 Áp dụng lịch này cho các tủ ${esc(cab.cfg.area)}</button></div></div>`;
}
function tabLog(cab) {
  return `<div class="panel"><h2>Nhật ký tủ (phiên này)</h2>${cab.log.length ? cab.log.map(l => `<div class="io"><span class="sub" style="min-width:90px">${fmtTime(l.t)}</span><span class="grow">${esc(l.s)}</span></div>`).join('') : '<div class="empty">Chưa có sự kiện</div>'}</div>`;
}

/* ---------- Điều khiển tập trung ---------- */
function viewControl() {
  if (!LG.ready || !App.inited) return gisLoading();
  const cabs = ctlFiltered().sort((a, b) => a.cfg.id.localeCompare(b.cfg.id));
  const allSel = cabs.length && cabs.every(c => App.sel.has(c.cfg.key));
  const nSel = [...App.sel].filter(k => App.cabs[k] && App.visibleCabs().includes(App.cabs[k])).length;
  return `${ctlTabs('hang-loat')}${ctlSearch('ctlQ2')}<p class="sub">Lọc theo quận / ô tìm, chọn tủ, chọn kênh rồi bật/tắt cùng lúc. "Chọn tất cả" áp dụng cho mọi tủ đang lọc.</p>
    <div class="panel">
      <label class="ctl-row" style="padding-top:0"><input type="checkbox" data-act="sel-all" ${allSel ? 'checked' : ''}><span class="grow"><b>Chọn tất cả (${cabs.length} tủ)</b><span class="sub" style="display:block">Bấm nút K để bật/tắt riêng từng kênh</span></span></label>
      ${cabs.slice(0, 80).map(c => `<div class="ctl-row"><input type="checkbox" data-act="sel" data-key="${esc(c.cfg.key)}" ${App.sel.has(c.cfg.key) ? 'checked' : ''} aria-label="Chọn ${esc(c.cfg.id)}">
          <div class="grow"><span class="dot ${({ok: 'ok', warn: 'warn', bad: 'bad', off: ''})[App.cabState(c)]}"></span> <a href="#/tu/${encodeURIComponent(c.cfg.key)}/vao-ra"><b>${esc(c.cfg.id)}</b></a> <span class="sub">${esc(c.cfg.name)} · ${modeInfo(c.tele).txt}</span>
          ${lampsHtml(c, true)}</div></div>`).join('')}
      ${cabs.length > 80 ? `<div class="sub" style="padding:8px 0">… và ${cabs.length - 80} tủ khác (vẫn được tính khi "Chọn tất cả").</div>` : ''}
    </div>
    <div class="sticky-bar"><div class="row">
      <b class="grow">Đã chọn ${nSel} tủ</b>
      <select class="in" id="bulkCh" data-act="bulk-ch" aria-label="Kênh"><option value="all">Tất cả kênh</option>${DEF_DO.map((n, c) => `<option value="${c + 1}"${App.bulkCh === String(c + 1) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
    </div><div class="btns" style="margin-top:8px">
      <button class="btn ok" data-act="bulk" data-val="1">💡 Bật</button>
      <button class="btn" data-act="bulk" data-val="0">⚫ Tắt</button>
      <button class="btn" data-act="bulk" data-val="auto">🕒 Về tự động</button>
    </div></div>`;
}

/* ---------- Cảnh báo / sự cố ---------- */
function viewAlerts() {
  const f = App.incFilter, teams = App.settings.teams;
  const list = App.incidents.filter(x => f === 'all' || (f === 'open' ? x.status !== 'done' : x.status === f))
    .sort((a, b) => (a.status === 'done') - (b.status === 'done') || (ALARM[b.code]?.sev || 0) - (ALARM[a.code]?.sev || 0) || b.at - a.at);
  const openLogs = new Set([...document.querySelectorAll('#main details[open]')].map(d => d.dataset.no));
  return `<div class="row" style="margin-bottom:10px"><h1 class="grow" style="margin:0">Cảnh báo & sự cố</h1>
      <button class="btn sm" data-act="report">📋 Báo cáo ngày</button><button class="btn sm" data-act="inc-csv">⬇️ Excel</button></div>
    <div class="tabs">${[['open', 'Chưa xong'], ['new', 'Mới'], ['assigned', 'Đã giao'], ['doing', 'Đang xử lý'], ['done', 'Hoàn thành'], ['all', 'Tất cả']]
      .map(([k, n]) => `<button data-act="inc-filter" data-val="${k}" class="${k === f ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="grid">${list.map(x => {
      const info = ALARM[x.code] || {label: x.code, icon: '•', act: '', sev: 1};
      const sevCls = info.sev >= 3 ? 'bad' : info.sev === 2 ? 'warn' : 'off';
      const stPill = x.status === 'done' ? 'ok' : x.status === 'new' ? 'bad' : 'warn';
      const ph = x.phases.length ? ' – ' + x.phases.map(p => phaseLabel(x.code, p)).join(', ') : '';
      const btns = x.status === 'done' ? `<button class="btn sm" data-act="inc" data-op="reopen" data-no="${x.no}">Mở lại</button>` :
        (x.status === 'new' ? `<button class="btn sm pri" data-act="inc" data-op="assign" data-no="${x.no}">Giao việc</button>` : '') +
        (x.status !== 'doing' ? `<button class="btn sm" data-act="inc" data-op="doing" data-no="${x.no}">Đang xử lý</button>` : '') +
        `<button class="btn sm" data-act="inc" data-op="done" data-no="${x.no}">Hoàn thành</button>`;
      return `<div class="card inc s-${sevCls}">
        <div class="row"><div class="grow"><b>${info.icon} ${esc(info.label)}${esc(ph)}</b>
          <div class="sub">${esc(x.no)} · <a href="#/tu/${encodeURIComponent(x.cab)}"><b>${esc(x.tu)}</b></a> ${esc(x.name)} · ${esc(x.area)}</div>
          <div class="sub">🕒 ${fmtTime(x.at)}${x.count > 1 ? ` · lặp ${x.count} lần` : ''}${x.cleared ? ' · <b style="color:var(--ok)">thiết bị báo đã hết</b>' : ''}</div></div>
          <span class="pill ${stPill}">${STATUS[x.status]}</span></div>
        <div class="act">👉 ${esc(info.act)}</div>
        ${incWhere(x)}
        ${x.note ? `<div class="sub" style="margin-top:6px">📝 ${esc(x.note)}</div>` : ''}
        <div class="btns"><select class="in" data-act="inc-team" data-no="${x.no}" aria-label="Tổ phụ trách">${teams.map(t => `<option${t === x.team ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>${btns}
          <button class="btn sm" data-act="inc" data-op="zalo" data-no="${x.no}">📤 Zalo</button>
          ${incMapBtn(x)}<a class="btn sm" href="#/tu/${encodeURIComponent(x.cab)}/3d/${segOf(x.code, x.phases[0] || '-')}">🧊 Sơ đồ tủ</a></div>
        <details class="log" data-no="${x.no}"${openLogs.has(x.no) ? ' open' : ''}><summary>Nhật ký (${x.log.length})</summary>${x.log.map(l => `<div>${fmtTime(l.t)} – ${esc(l.s)}</div>`).join('')}</details>
      </div>`;
    }).join('') || '<div class="empty">Không có sự cố ở mục này.</div>'}</div>`;
}
function incWhere(x) {
  if (!LG.ready) return '';
  const parts = [];
  if (x.cand && x.cand.length && (x.code === 'CAT_CAP' || x.code === 'KHONG_SANG')) parts.push(`nghi đứt ${LG.where(x.cand[0])}${x.cand.length > 1 ? ` (+${x.cand.length - 1} vị trí khác cùng mức dòng)` : ''}${x.lost ? ` · thiếu ${x.lost} A` : ''}`);
  if (x.mark && x.mark.pole !== undefined) parts.push(`📍 đã ghim ${x.mark.kind === 'post' ? 'tại trụ ' + LG.poleName(x.mark.pole) : 'trước trụ ' + LG.poleName(x.mark.pole)} (≈ ${Math.round(LG.PD[x.mark.pole])} m theo cáp)`);
  return parts.length ? `<div class="sub" style="margin-top:6px;color:var(--ink)">📌 Vị trí: ${esc(parts.join(' · '))}</div>` : '';
}
